<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#062244"/>
      <stop offset="55%" stop-color="#031024"/>
      <stop offset="100%" stop-color="#01050D"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF275"/>
      <stop offset="85%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF9500" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3D0604" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="35%" stop-color="#FF3B30"/>
      <stop offset="75%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#3D0604"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="50%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#3D0604"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFD60A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFD60A"/>
      <stop offset="70%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#3D0604"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Radiant Full Moon with Lunar Corona -->
        <circle cx="250" cy="205" r="140" fill="#FFF275" opacity="0.12" filter="url(#glow)"/>
        <circle cx="250" cy="205" r="120" fill="url(#moon-grad)"/>
        <!-- Lunar Maria details -->
        <ellipse cx="230" cy="180" rx="35" ry="25" fill="#3D0604" opacity="0.2"/>
        <ellipse cx="280" cy="225" rx="30" ry="20" fill="#3D0604" opacity="0.18"/>
        <circle cx="205" cy="235" r="16" fill="#3D0604" opacity="0.15"/>
        

  <!-- Sacred Halo Geometry -->
  
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#FFD60A" stroke-width="2" fill="none" opacity="0.7" transform="rotate(-25 250 220)"/>
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#FF9500" stroke-width="2" fill="none" opacity="0.7" transform="rotate(35 250 220)"/>
        <circle cx="85" cy="165" r="7" fill="#FFD60A" filter="url(#glow)"/>
        <circle cx="410" cy="285" r="9" fill="#FF3B30" filter="url(#glow)"/>
        <circle cx="395" cy="140" r="6" fill="#FFF275"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#FF9500" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#FF9500" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#FFD60A" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#FF9500" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#FF9500" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FFD60A" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFF275" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#3D0604" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#031024" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#FF3B30" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tengu-body">
          <!-- Black Feathered Yōkai Wings -->
          <path d="M 250 270 Q 140 170 80 200 Q 130 280 180 340 Z" fill="url(#wing-grad)" stroke="#3D0604" stroke-width="2"/>
          <path d="M 250 270 Q 360 170 420 200 Q 370 280 320 340 Z" fill="url(#wing-grad)" stroke="#3D0604" stroke-width="2"/>
          <!-- Warrior Kimono Mantle & Torso -->
          <path d="M 195 380 L 220 260 L 280 260 L 305 380 Z" fill="url(#body-grad)" stroke="#3D0604" stroke-width="2"/>
          <!-- Crossed Martial Collar Lapels -->
          <path d="M 215 260 L 265 340 M 285 260 L 235 340" stroke="#FFD60A" stroke-width="3"/>
          <!-- Tengu Head Visage -->
          <ellipse cx="250" cy="185" rx="38" ry="32" fill="url(#body-grad)" stroke="#3D0604" stroke-width="2"/>
          <!-- Prominent Crow Beak or High Mask Nose -->
          <polygon points="242,185 258,185 250,225" fill="#FFD60A" stroke="#3D0604" stroke-width="1.5"/>
          <!-- Yamabushi Tokin Pillbox Hat -->
          <polygon points="230,150 270,150 265,130 235,130" fill="#3D0604" stroke="#FFD60A" stroke-width="2"/>
          <circle cx="250" cy="140" r="4" fill="#FF3B30"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#FFF275"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#FFF275"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Sun Flame Mark -->
        <path d="M 250 142 Q 256 150 250 162 Q 244 150 250 142 Z" fill="#FFD60A" stroke="#FF3B30" stroke-width="1.2" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Celestial Vajra / Sword Relic -->
        <g transform="translate(110, 320)">
          <line x1="0" y1="35" x2="28" y2="0" stroke="#FFD60A" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
          <circle cx="14" cy="18" r="6" fill="#FF3B30" stroke="#FFF275" stroke-width="1.5"/>
        </g>
        
</svg>