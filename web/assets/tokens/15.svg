<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#660A18"/>
      <stop offset="55%" stop-color="#3D040D"/>
      <stop offset="100%" stop-color="#1C0105"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B388FF"/>
      <stop offset="85%" stop-color="#03DAC6"/>
      <stop offset="100%" stop-color="#6200EA"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#03DAC6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3700B3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09001A" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="35%" stop-color="#6200EA"/>
      <stop offset="75%" stop-color="#3700B3"/>
      <stop offset="100%" stop-color="#09001A"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="50%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#09001A"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#03DAC6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3700B3" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#03DAC6"/>
      <stop offset="70%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#09001A"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Celestial Disk & Astral Starfield -->
        <circle cx="250" cy="210" r="135" fill="url(#celestial-disk)"/>
        <g fill="#B388FF" opacity="0.8">
          <circle cx="90" cy="80" r="2.5"/><circle cx="410" cy="95" r="3"/>
          <circle cx="140" cy="50" r="2"/><circle cx="360" cy="60" r="2.5"/>
          <circle cx="70" cy="170" r="1.5"/><circle cx="430" cy="190" r="2"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="195" stroke="#03DAC6" stroke-width="3" fill="none" opacity="0.65"/>
        <path d="M 80 200 Q 140 160 200 210 Q 250 170 300 210 Q 360 160 420 200" stroke="#3700B3" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
        <circle cx="250" cy="220" r="178" stroke="#6200EA" stroke-width="1.5" fill="none" stroke-dasharray="12 6" opacity="0.6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <polygon points="90,110 98,140 106,110 98,80" fill="#03DAC6" opacity="0.9" filter="url(#glow)"/>
        <polygon points="400,120 408,150 416,120 408,90" fill="#03DAC6" opacity="0.9" filter="url(#glow)"/>
        <polygon points="120,310 126,330 132,310 126,290" fill="#B388FF" opacity="0.85"/>
        <polygon points="380,300 386,320 392,300 386,280" fill="#B388FF" opacity="0.85"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#03DAC6" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#B388FF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#09001A" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#3D040D" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#6200EA" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="kitsune-body">
          <!-- Majestic Arc of Nine Voluminous Bushy Tails -->
          <g filter="url(#glow)">
            <path d="M 250 340 Q 140 330 75 280" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 120 280 80 200" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 130 210 115 130" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 170 160 170 85" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 250 140 250 65" stroke="url(#wing-grad)" stroke-width="26" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 330 160 330 85" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 370 210 385 130" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 380 280 420 200" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 360 330 425 280" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
          </g>
          <!-- Kitsune Torso & Slender Silhouette -->
          <path d="M 205 380 Q 220 260 250 240 Q 280 260 295 380 Z" fill="url(#body-grad)" stroke="#09001A" stroke-width="2"/>
          <!-- Pointed Fox Ears -->
          <polygon points="215,165 190,95 240,140" fill="url(#body-grad)" stroke="#09001A" stroke-width="1.8"/>
          <polygon points="212,155 198,108 230,138" fill="#6200EA"/>
          <polygon points="285,165 310,95 260,140" fill="url(#body-grad)" stroke="#09001A" stroke-width="1.8"/>
          <polygon points="288,155 302,108 270,138" fill="#6200EA"/>
          <!-- Fox Face & Muzzle -->
          <polygon points="205,170 295,170 250,230" fill="url(#body-grad)" stroke="#09001A" stroke-width="2"/>
          <polygon points="244,222 256,222 250,230" fill="#09001A"/>
          <!-- Cheek Whiskers -->
          <path d="M 215 195 L 180 190 M 215 205 L 185 210" stroke="#03DAC6" stroke-width="2" stroke-linecap="round"/>
          <path d="M 285 195 L 320 190 M 285 205 L 315 210" stroke="#03DAC6" stroke-width="2" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#09001A" stroke="#03DAC6" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#09001A" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#09001A" stroke="#03DAC6" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#09001A" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Imperial King Glyph '王' -->
        <g transform="translate(239, 148)" stroke="#03DAC6" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
          <line x1="0" y1="0" x2="22" y2="0"/>
          <line x1="3" y1="8" x2="19" y2="8"/>
          <line x1="0" y1="16" x2="22" y2="16"/>
          <line x1="11" y1="0" x2="11" y2="16"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Bronze Scrying Mirror -->
        <circle cx="380" cy="330" r="20" fill="#09001A" stroke="#03DAC6" stroke-width="3" filter="url(#glow)"/>
        <circle cx="380" cy="330" r="14" fill="#03DAC6" opacity="0.4"/>
        <circle cx="380" cy="330" r="6" fill="#B388FF"/>
        
</svg>