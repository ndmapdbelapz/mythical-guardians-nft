<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0B4157"/>
      <stop offset="55%" stop-color="#062735"/>
      <stop offset="100%" stop-color="#02121A"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E1F5FE"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#70E4EF"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E0F7FA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07242C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#70E4EF"/>
      <stop offset="75%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#07242C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#70E4EF"/>
      <stop offset="100%" stop-color="#07242C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E0F7FA" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#70E4EF"/>
      <stop offset="100%" stop-color="#07242C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Celestial Disk & Astral Starfield -->
        <circle cx="250" cy="210" r="135" fill="url(#celestial-disk)"/>
        <g fill="#E1F5FE" opacity="0.8">
          <circle cx="90" cy="80" r="2.5"/><circle cx="410" cy="95" r="3"/>
          <circle cx="140" cy="50" r="2"/><circle cx="360" cy="60" r="2.5"/>
          <circle cx="70" cy="170" r="1.5"/><circle cx="430" cy="190" r="2"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7" transform="rotate(-25 250 220)"/>
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#E0F7FA" stroke-width="2" fill="none" opacity="0.7" transform="rotate(35 250 220)"/>
        <circle cx="85" cy="165" r="7" fill="#FFFFFF" filter="url(#glow)"/>
        <circle cx="410" cy="285" r="9" fill="#70E4EF" filter="url(#glow)"/>
        <circle cx="395" cy="140" r="6" fill="#E1F5FE"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#E0F7FA" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#E0F7FA" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#FFFFFF" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#E0F7FA" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#E0F7FA" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#E1F5FE" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#07242C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#062735" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#70E4EF" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="phoenix-body">
          <!-- Grand Multi-Tiered Arched Wings -->
          <path d="M 250 250 Q 170 120 70 130 Q 110 210 160 270 Z" fill="url(#wing-grad)" stroke="#FFFFFF" stroke-width="2.5"/>
          <path d="M 250 250 Q 330 120 430 130 Q 390 210 340 270 Z" fill="url(#wing-grad)" stroke="#FFFFFF" stroke-width="2.5"/>
          <!-- Feather Primary Blades -->
          <path d="M 70 130 Q 40 165 65 210 M 95 155 Q 70 195 95 240 M 120 180 Q 95 225 125 270" stroke="#E1F5FE" stroke-width="3" fill="none"/>
          <path d="M 430 130 Q 460 165 435 210 M 405 155 Q 430 195 405 240 M 380 180 Q 405 225 375 270" stroke="#E1F5FE" stroke-width="3" fill="none"/>
          <!-- Phoenix Torso & Golden Breast -->
          <path d="M 220 220 Q 250 180 280 220 Q 285 290 250 335 Q 215 290 220 220 Z" fill="url(#body-grad)" stroke="#07242C" stroke-width="2"/>
          <ellipse cx="250" cy="265" rx="22" ry="38" fill="url(#belly-grad)" opacity="0.9"/>
          <!-- Graceful Neck & Head -->
          <path d="M 240 210 Q 242 165 250 150 Q 258 165 260 210 Z" fill="url(#body-grad)"/>
          <circle cx="250" cy="145" r="18" fill="url(#body-grad)" stroke="#FFFFFF" stroke-width="1.5"/>
          <!-- Golden Raptor Beak -->
          <polygon points="250,148 266,152 250,158" fill="#FFFFFF" stroke="#07242C" stroke-width="1"/>
          <!-- Triple Coronal Crown Feathers -->
          <path d="M 245 130 Q 225 80 205 90 M 250 128 Q 250 70 250 75 M 255 130 Q 275 80 295 90" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <!-- Flowing Cascading Tail Plumes -->
          <path d="M 240 330 Q 200 400 170 470 M 250 335 Q 250 410 250 480 M 260 330 Q 300 400 330 470" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FFFFFF" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FFFFFF" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        
            <!-- Enlightened Vertical Third Eye -->
            <ellipse cx="250" cy="148" rx="4" ry="7" fill="#FFFFFF" filter="url(#glow)"/>
            <circle cx="250" cy="148" r="2.5" fill="#FFFFFF"/>
            

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Lunar Crescent Mark -->
        <path d="M 246 146 A 8 8 0 0 0 254 160 A 6 6 0 0 1 246 146 Z" fill="#FFFFFF" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Laozi Thunder Gourd -->
        <g transform="translate(370, 320)">
          <ellipse cx="14" cy="14" rx="10" ry="9" fill="#FFFFFF" stroke="#07242C" stroke-width="1.5"/>
          <ellipse cx="14" cy="28" rx="15" ry="14" fill="#FFFFFF" stroke="#07242C" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#70E4EF" stroke-width="2.5"/>
        </g>
        
</svg>