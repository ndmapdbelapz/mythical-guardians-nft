<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#24334E"/>
      <stop offset="55%" stop-color="#131D31"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="85%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D01000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1F0402" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="35%" stop-color="#FF4500"/>
      <stop offset="75%" stop-color="#D01000"/>
      <stop offset="100%" stop-color="#1F0402"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#1F0402"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFA000" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D01000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFA000"/>
      <stop offset="70%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#1F0402"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Layered Mountain Peaks & Floating Isles -->
        <path d="M 0 320 Q 90 210 180 280 T 360 250 T 500 310 L 500 500 L 0 500 Z" fill="#1F0402" opacity="0.8"/>
        <path d="M 80 290 Q 180 180 280 270 T 460 240 L 500 300 L 500 500 L 0 500 Z" fill="#131D31" opacity="0.5"/>
        <ellipse cx="120" cy="140" rx="45" ry="14" fill="#1F0402" opacity="0.85"/>
        <ellipse cx="380" cy="120" rx="55" ry="16" fill="#1F0402" opacity="0.85"/>
        <circle cx="250" cy="190" r="110" fill="#FFA000" opacity="0.18" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#FF4500" stroke-width="2" fill="none" opacity="0.8"/>
        <circle cx="250" cy="220" r="190" stroke="#FFA000" stroke-width="1.5" fill="none" stroke-dasharray="10 8" opacity="0.7"/>
        <circle cx="250" cy="220" r="175" stroke="#D01000" stroke-width="2" fill="none" opacity="0.6"/>
        <g stroke="#FFA000" stroke-width="1.2" fill="none" opacity="0.65">
          <ellipse cx="250" cy="220" rx="205" ry="50" transform="rotate(0 250 220)"/>
          <ellipse cx="250" cy="220" rx="205" ry="50" transform="rotate(60 250 220)"/>
          <ellipse cx="250" cy="220" rx="205" ry="50" transform="rotate(120 250 220)"/>
        </g>
        

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#D01000" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#D01000" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#FFA000" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#D01000" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#D01000" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FFA000" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFE082" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#1F0402" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#131D31" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#FF4500" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="phoenix-body">
          <!-- Grand Multi-Tiered Arched Wings -->
          <path d="M 250 250 Q 170 120 70 130 Q 110 210 160 270 Z" fill="url(#wing-grad)" stroke="#FFA000" stroke-width="2.5"/>
          <path d="M 250 250 Q 330 120 430 130 Q 390 210 340 270 Z" fill="url(#wing-grad)" stroke="#FFA000" stroke-width="2.5"/>
          <!-- Feather Primary Blades -->
          <path d="M 70 130 Q 40 165 65 210 M 95 155 Q 70 195 95 240 M 120 180 Q 95 225 125 270" stroke="#FFE082" stroke-width="3" fill="none"/>
          <path d="M 430 130 Q 460 165 435 210 M 405 155 Q 430 195 405 240 M 380 180 Q 405 225 375 270" stroke="#FFE082" stroke-width="3" fill="none"/>
          <!-- Phoenix Torso & Golden Breast -->
          <path d="M 220 220 Q 250 180 280 220 Q 285 290 250 335 Q 215 290 220 220 Z" fill="url(#body-grad)" stroke="#1F0402" stroke-width="2"/>
          <ellipse cx="250" cy="265" rx="22" ry="38" fill="url(#belly-grad)" opacity="0.9"/>
          <!-- Graceful Neck & Head -->
          <path d="M 240 210 Q 242 165 250 150 Q 258 165 260 210 Z" fill="url(#body-grad)"/>
          <circle cx="250" cy="145" r="18" fill="url(#body-grad)" stroke="#FFA000" stroke-width="1.5"/>
          <!-- Golden Raptor Beak -->
          <polygon points="250,148 266,152 250,158" fill="#FFA000" stroke="#1F0402" stroke-width="1"/>
          <!-- Triple Coronal Crown Feathers -->
          <path d="M 245 130 Q 225 80 205 90 M 250 128 Q 250 70 250 75 M 255 130 Q 275 80 295 90" stroke="#FFA000" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <!-- Flowing Cascading Tail Plumes -->
          <path d="M 240 330 Q 200 400 170 470 M 250 335 Q 250 410 250 480 M 260 330 Q 300 400 330 470" stroke="#FFA000" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#FFE082"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#FFE082"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Imperial Golden Phoenix Coronet -->
        <g transform="translate(250, 130)">
          <path d="M -25 0 Q 0 -22 25 0 L 20 8 Q 0 -10 -20 8 Z" fill="#FFA000" stroke="#1F0402" stroke-width="1.5"/>
          <circle cx="0" cy="-14" r="5" fill="#FF4500" filter="url(#glow)"/>
          <line x1="-15" y1="0" x2="-22" y2="18" stroke="#FFA000" stroke-width="2"/>
          <line x1="15" y1="0" x2="22" y2="18" stroke="#FFA000" stroke-width="2"/>
        </g>
        

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Celestial Vajra / Sword Relic -->
        <g transform="translate(110, 320)">
          <line x1="0" y1="35" x2="28" y2="0" stroke="#FFA000" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
          <circle cx="14" cy="18" r="6" fill="#FF4500" stroke="#FFE082" stroke-width="1.5"/>
        </g>
        
</svg>