<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0B4157"/>
      <stop offset="55%" stop-color="#062735"/>
      <stop offset="100%" stop-color="#02121A"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F5E9"/>
      <stop offset="85%" stop-color="#B9F6CA"/>
      <stop offset="100%" stop-color="#00C853"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9F6CA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#69F0AE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06240E" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="35%" stop-color="#00C853"/>
      <stop offset="75%" stop-color="#69F0AE"/>
      <stop offset="100%" stop-color="#06240E"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#06240E"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#B9F6CA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#69F0AE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#B9F6CA"/>
      <stop offset="70%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#06240E"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Celestial Disk & Astral Starfield -->
        <circle cx="250" cy="210" r="135" fill="url(#celestial-disk)"/>
        <g fill="#E8F5E9" opacity="0.8">
          <circle cx="90" cy="80" r="2.5"/><circle cx="410" cy="95" r="3"/>
          <circle cx="140" cy="50" r="2"/><circle cx="360" cy="60" r="2.5"/>
          <circle cx="70" cy="170" r="1.5"/><circle cx="430" cy="190" r="2"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#B9F6CA" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#69F0AE" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#00C853" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#B9F6CA" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#E8F5E9" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#00C853"/>
        <circle cx="430" cy="340" r="3.5" fill="#B9F6CA"/>
        <circle cx="160" cy="70" r="2.5" fill="#69F0AE"/>
        <circle cx="340" cy="65" r="3" fill="#B9F6CA"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#B9F6CA" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#E8F5E9" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#06240E" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#062735" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#00C853" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="qilin-body">
          <!-- Qilin Scaled Torso & Cloven Hooves Posture -->
          <path d="M 180 380 Q 195 250 250 230 Q 305 250 320 380 Z" fill="url(#body-grad)" stroke="#06240E" stroke-width="2.5"/>
          <!-- Cloud-like Mane of Fire -->
          <path d="M 190 240 Q 160 200 185 170 Q 170 140 210 135 M 310 240 Q 340 200 315 170 Q 330 140 290 135" stroke="#B9F6CA" stroke-width="5" fill="none" filter="url(#glow)"/>
          <!-- Qilin Head & Jaw -->
          <ellipse cx="250" cy="180" rx="48" ry="40" fill="url(#body-grad)" stroke="#06240E" stroke-width="2"/>
          <ellipse cx="250" cy="205" rx="26" ry="18" fill="#06240E" stroke="#00C853" stroke-width="1.5"/>
          <circle cx="250" cy="202" r="5" fill="#B9F6CA"/>
          <!-- Branching Crystal Antlers / Horn -->
          <path d="M 235 145 Q 210 80 170 70 M 195 100 Q 170 115 155 125" stroke="#B9F6CA" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <path d="M 265 145 Q 290 80 330 70 M 305 100 Q 330 115 345 125" stroke="#B9F6CA" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <!-- Bearded Chin & Flared Whiskers -->
          <path d="M 240 220 Q 250 255 260 220" stroke="#B9F6CA" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Celestial Vajra / Sword Relic -->
        <g transform="translate(110, 320)">
          <line x1="0" y1="35" x2="28" y2="0" stroke="#B9F6CA" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
          <circle cx="14" cy="18" r="6" fill="#00C853" stroke="#E8F5E9" stroke-width="1.5"/>
        </g>
        
</svg>