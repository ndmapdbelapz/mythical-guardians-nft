<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#5E1812"/>
      <stop offset="55%" stop-color="#350F0B"/>
      <stop offset="100%" stop-color="#180605"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B388FF"/>
      <stop offset="85%" stop-color="#03DAC6"/>
      <stop offset="100%" stop-color="#6200EA"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#03DAC6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3700B3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09001A" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="35%" stop-color="#6200EA"/>
      <stop offset="75%" stop-color="#3700B3"/>
      <stop offset="100%" stop-color="#09001A"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="50%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#09001A"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#03DAC6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3700B3" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#03DAC6"/>
      <stop offset="70%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#09001A"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Torii Gate Silhouette & Diagonal Rays -->
        <circle cx="250" cy="210" r="125" fill="#6200EA" opacity="0.22" filter="url(#glow)"/>
        <g opacity="0.45" stroke="#03DAC6" stroke-width="1.5">
          <line x1="250" y1="210" x2="40" y2="40"/>
          <line x1="250" y1="210" x2="460" y2="40"/>
          <line x1="250" y1="210" x2="10" y2="180"/>
          <line x1="250" y1="210" x2="490" y2="180"/>
        </g>
        <!-- Distant Torii Silhouette -->
        <path d="M 175 140 L 325 140 M 185 155 L 315 155 M 200 140 L 200 240 M 300 140 L 300 240" stroke="#09001A" stroke-width="7" stroke-linecap="square"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#03DAC6" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#3700B3" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#6200EA" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <path d="M 60 70 L 105 140 L 85 150 L 140 230 M 430 80 L 390 145 L 410 155 L 365 240" stroke="#03DAC6" stroke-width="3" fill="none" opacity="0.9" filter="url(#glow)"/>
        <path d="M 130 50 L 160 100 L 150 108 L 180 160 M 330 40 L 310 95 L 325 105 L 295 170" stroke="#B388FF" stroke-width="2" fill="none" opacity="0.95"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#03DAC6" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#B388FF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#09001A" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#350F0B" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#6200EA" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tiger-body">
          <!-- Muscular Tiger Shoulders & Torso -->
          <path d="M 160 380 C 150 290 190 240 250 240 C 310 240 350 290 340 380 Z" fill="url(#body-grad)" stroke="#09001A" stroke-width="2.5"/>
          <!-- Pointed Triangular Ears -->
          <polygon points="190,140 165,85 215,115" fill="url(#body-grad)" stroke="#09001A" stroke-width="2"/>
          <polygon points="185,130 172,95 205,115" fill="#6200EA"/>
          <polygon points="310,140 335,85 285,115" fill="url(#body-grad)" stroke="#09001A" stroke-width="2"/>
          <polygon points="315,130 328,95 295,115" fill="#6200EA"/>
          <!-- Tiger Head -->
          <ellipse cx="250" cy="180" rx="68" ry="58" fill="url(#body-grad)" stroke="#09001A" stroke-width="2"/>
          <!-- Muzzle & Snout -->
          <ellipse cx="250" cy="205" rx="30" ry="20" fill="#09001A" stroke="#6200EA" stroke-width="2"/>
          <polygon points="243,195 257,195 250,205" fill="#03DAC6"/>
          <!-- Fierce Curved Fangs -->
          <polygon points="228,215 238,215 233,238" fill="#FFFFFF" stroke="#09001A" stroke-width="1"/>
          <polygon points="272,215 262,215 267,238" fill="#FFFFFF" stroke="#09001A" stroke-width="1"/>
          <!-- Celestial War Stripes -->
          <path d="M 185 160 Q 210 165 220 175 M 315 160 Q 290 165 280 175" stroke="#09001A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 180 195 Q 210 200 225 205 M 320 195 Q 290 200 275 205" stroke="#09001A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 195 225 Q 215 228 228 230 M 305 225 Q 285 228 272 230" stroke="#09001A" stroke-width="4" stroke-linecap="round"/>
          <!-- Iron Gorget Collar at Chest -->
          <path d="M 195 270 Q 250 295 305 270 L 290 310 Q 250 335 210 310 Z" fill="#09001A" stroke="#03DAC6" stroke-width="2.5"/>
          <circle cx="250" cy="295" r="7" fill="#03DAC6" filter="url(#glow)"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Laozi Thunder Gourd -->
        <g transform="translate(370, 320)">
          <ellipse cx="14" cy="14" rx="10" ry="9" fill="#03DAC6" stroke="#09001A" stroke-width="1.5"/>
          <ellipse cx="14" cy="28" rx="15" ry="14" fill="#03DAC6" stroke="#09001A" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#6200EA" stroke-width="2.5"/>
        </g>
        
</svg>