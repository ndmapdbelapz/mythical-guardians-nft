<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#4F370C"/>
      <stop offset="55%" stop-color="#2F2107"/>
      <stop offset="100%" stop-color="#150F03"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#80D8FF"/>
      <stop offset="85%" stop-color="#651FFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#651FFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2979FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05081E" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#651FFF"/>
      <stop offset="35%" stop-color="#00E5FF"/>
      <stop offset="75%" stop-color="#2979FF"/>
      <stop offset="100%" stop-color="#05081E"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#651FFF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#05081E"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#651FFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2979FF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#651FFF"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#05081E"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Zodiac Constellation Star Chart -->
        <circle cx="250" cy="210" r="130" stroke="#651FFF" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>
        <g stroke="#80D8FF" stroke-width="1" opacity="0.75" fill="#80D8FF">
          <line x1="120" y1="120" x2="180" y2="90"/>
          <line x1="180" y1="90" x2="250" y2="110"/>
          <line x1="250" y1="110" x2="320" y2="80"/>
          <line x1="320" y1="80" x2="380" y2="130"/>
          <circle cx="120" cy="120" r="3.5"/>
          <circle cx="180" cy="90" r="4.5"/>
          <circle cx="250" cy="110" r="5.5"/>
          <circle cx="320" cy="80" r="4"/>
          <circle cx="380" cy="130" r="3.5"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="195" stroke="#651FFF" stroke-width="3" fill="none" opacity="0.65"/>
        <path d="M 80 200 Q 140 160 200 210 Q 250 170 300 210 Q 360 160 420 200" stroke="#2979FF" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
        <circle cx="250" cy="220" r="178" stroke="#00E5FF" stroke-width="1.5" fill="none" stroke-dasharray="12 6" opacity="0.6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#651FFF" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#80D8FF" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#00E5FF"/>
        <circle cx="430" cy="340" r="3.5" fill="#651FFF"/>
        <circle cx="160" cy="70" r="2.5" fill="#2979FF"/>
        <circle cx="340" cy="65" r="3" fill="#651FFF"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#651FFF" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#80D8FF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#05081E" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#2F2107" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#00E5FF" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tortoise-body">
          <!-- Great Fortress Carapace Carved Shell -->
          <path d="M 140 380 Q 130 220 250 200 Q 370 220 360 380 Z" fill="url(#body-grad)" stroke="#05081E" stroke-width="3"/>
          <!-- Hexagonal Shell Scutes -->
          <polygon points="250,225 280,245 280,285 250,305 220,285 220,245" fill="#05081E" stroke="#651FFF" stroke-width="2"/>
          <polygon points="250,315 280,335 280,375 250,395 220,375 220,335" fill="#05081E" stroke="#651FFF" stroke-width="2"/>
          <polygon points="185,265 215,285 215,325 185,345 155,325 155,285" fill="#05081E" stroke="#651FFF" stroke-width="2"/>
          <polygon points="315,265 345,285 345,325 315,345 285,325 285,285" fill="#05081E" stroke="#651FFF" stroke-width="2"/>
          <!-- Tortoise Ancient Head -->
          <ellipse cx="250" cy="180" rx="34" ry="26" fill="url(#body-grad)" stroke="#05081E" stroke-width="2"/>
          <!-- Bearded Chin & Shell Crest -->
          <path d="M 238 200 Q 250 225 262 200" stroke="#651FFF" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Intertwined Divine Serpent Coiling Overhead -->
          <path d="M 150 340 C 120 250 170 140 220 110 C 260 85 310 95 330 135 C 345 165 330 215 365 290"
                stroke="url(#wing-grad)" stroke-width="16" fill="none" stroke-linecap="round"/>
          <ellipse cx="230" cy="105" rx="14" ry="10" fill="#00E5FF" stroke="#651FFF" stroke-width="1.5"/>
          <circle cx="234" cy="103" r="2.5" fill="#80D8FF"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <g transform="translate(250, 136)">
          <path d="M -30 0 Q 0 -12 30 0 L 25 8 Q 0 -4 -25 8 Z" fill="#651FFF" stroke="#05081E" stroke-width="1.5"/>
          <circle cx="0" cy="-3" r="5" fill="#00E5FF"/>
        </g>
        

  <!-- Forehead Glyph -->
  
        <!-- Lunar Crescent Mark -->
        <path d="M 246 146 A 8 8 0 0 0 254 160 A 6 6 0 0 1 246 146 Z" fill="#651FFF" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Radiant Dragon Pearl Orb -->
        <circle cx="120" cy="330" r="24" fill="url(#orb-grad)" filter="url(#hyper-glow)"/>
        <circle cx="120" cy="330" r="10" fill="#FFFFFF"/>
        <path d="M 100 330 Q 120 300 140 330" stroke="#651FFF" stroke-width="2" fill="none" opacity="0.8"/>
        
</svg>