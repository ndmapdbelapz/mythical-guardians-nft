<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0E381C"/>
      <stop offset="55%" stop-color="#072010"/>
      <stop offset="100%" stop-color="#030E07"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFCCBC"/>
      <stop offset="85%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#D84315"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAB91" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF7043" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#280A02" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="35%" stop-color="#D84315"/>
      <stop offset="75%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#280A02"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="50%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#280A02"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCCBC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFAB91" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFAB91"/>
      <stop offset="70%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#280A02"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Solar Eclipse Coronal Flare -->
        <circle cx="250" cy="205" r="145" fill="#FFAB91" opacity="0.3" filter="url(#bright-glow)"/>
        <circle cx="250" cy="205" r="115" stroke="#FFAB91" stroke-width="12" fill="none" opacity="0.8" stroke-dasharray="14 8"/>
        <circle cx="250" cy="205" r="110" fill="#280A02"/>
        <polygon points="250,75 256,105 250,98 244,105" fill="#FFAB91" filter="url(#glow)"/>
        <polygon points="380,205 350,211 357,205 350,199" fill="#FFAB91" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#FFAB91" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#FF7043" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#D84315" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#FFAB91" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#FFCCBC" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#D84315"/>
        <circle cx="430" cy="340" r="3.5" fill="#FFAB91"/>
        <circle cx="160" cy="70" r="2.5" fill="#FF7043"/>
        <circle cx="340" cy="65" r="3" fill="#FFAB91"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FFAB91" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFCCBC" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#280A02" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#072010" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#D84315" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tiger-body">
          <!-- Muscular Tiger Shoulders & Torso -->
          <path d="M 160 380 C 150 290 190 240 250 240 C 310 240 350 290 340 380 Z" fill="url(#body-grad)" stroke="#280A02" stroke-width="2.5"/>
          <!-- Pointed Triangular Ears -->
          <polygon points="190,140 165,85 215,115" fill="url(#body-grad)" stroke="#280A02" stroke-width="2"/>
          <polygon points="185,130 172,95 205,115" fill="#D84315"/>
          <polygon points="310,140 335,85 285,115" fill="url(#body-grad)" stroke="#280A02" stroke-width="2"/>
          <polygon points="315,130 328,95 295,115" fill="#D84315"/>
          <!-- Tiger Head -->
          <ellipse cx="250" cy="180" rx="68" ry="58" fill="url(#body-grad)" stroke="#280A02" stroke-width="2"/>
          <!-- Muzzle & Snout -->
          <ellipse cx="250" cy="205" rx="30" ry="20" fill="#280A02" stroke="#D84315" stroke-width="2"/>
          <polygon points="243,195 257,195 250,205" fill="#FFAB91"/>
          <!-- Fierce Curved Fangs -->
          <polygon points="228,215 238,215 233,238" fill="#FFFFFF" stroke="#280A02" stroke-width="1"/>
          <polygon points="272,215 262,215 267,238" fill="#FFFFFF" stroke="#280A02" stroke-width="1"/>
          <!-- Celestial War Stripes -->
          <path d="M 185 160 Q 210 165 220 175 M 315 160 Q 290 165 280 175" stroke="#280A02" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 180 195 Q 210 200 225 205 M 320 195 Q 290 200 275 205" stroke="#280A02" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 195 225 Q 215 228 228 230 M 305 225 Q 285 228 272 230" stroke="#280A02" stroke-width="4" stroke-linecap="round"/>
          <!-- Iron Gorget Collar at Chest -->
          <path d="M 195 270 Q 250 295 305 270 L 290 310 Q 250 335 210 310 Z" fill="#280A02" stroke="#FFAB91" stroke-width="2.5"/>
          <circle cx="250" cy="295" r="7" fill="#FFAB91" filter="url(#glow)"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#280A02" stroke="#FFAB91" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#FFEB3B" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#280A02" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#280A02" stroke="#FFAB91" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#FFEB3B" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#280A02" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Taiji Yin-Yang Mark -->
        <g transform="translate(250, 155)">
          <circle cx="0" cy="0" r="9" fill="#FFAB91" stroke="#280A02" stroke-width="1" filter="url(#glow)"/>
          <path d="M 0 -9 A 4.5 4.5 0 0 1 0 0 A 4.5 4.5 0 0 0 0 9 A 9 9 0 0 1 0 -9" fill="#280A02"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Imperial Jade Dragon Seal -->
        <g transform="translate(100, 320)">
          <rect x="0" y="10" width="34" height="26" rx="4" fill="#D84315" stroke="#FFAB91" stroke-width="2" filter="url(#glow)"/>
          <path d="M 8 10 Q 17 -6 26 10" stroke="#FFAB91" stroke-width="3" fill="none"/>
          <circle cx="17" cy="22" r="5" fill="#FFAB91"/>
        </g>
        
</svg>