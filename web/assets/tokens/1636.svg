<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#5E1812"/>
      <stop offset="55%" stop-color="#350F0B"/>
      <stop offset="100%" stop-color="#180605"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3E5F5"/>
      <stop offset="85%" stop-color="#E5B8F4"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B8F4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#BF5AF2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#20052C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B8F4"/>
      <stop offset="35%" stop-color="#AF52DE"/>
      <stop offset="75%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#20052C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E5B8F4"/>
      <stop offset="50%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#20052C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E5F5" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E5B8F4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E5B8F4"/>
      <stop offset="70%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#20052C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Torii Gate Silhouette & Diagonal Rays -->
        <circle cx="250" cy="210" r="125" fill="#AF52DE" opacity="0.22" filter="url(#glow)"/>
        <g opacity="0.45" stroke="#E5B8F4" stroke-width="1.5">
          <line x1="250" y1="210" x2="40" y2="40"/>
          <line x1="250" y1="210" x2="460" y2="40"/>
          <line x1="250" y1="210" x2="10" y2="180"/>
          <line x1="250" y1="210" x2="490" y2="180"/>
        </g>
        <!-- Distant Torii Silhouette -->
        <path d="M 175 140 L 325 140 M 185 155 L 315 155 M 200 140 L 200 240 M 300 140 L 300 240" stroke="#20052C" stroke-width="7" stroke-linecap="square"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#E5B8F4" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#BF5AF2" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#AF52DE" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#BF5AF2" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#BF5AF2" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#E5B8F4" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#BF5AF2" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#BF5AF2" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#E5B8F4" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#F3E5F5" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#20052C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#350F0B" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#AF52DE" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tengu-body">
          <!-- Black Feathered Yōkai Wings -->
          <path d="M 250 270 Q 140 170 80 200 Q 130 280 180 340 Z" fill="url(#wing-grad)" stroke="#20052C" stroke-width="2"/>
          <path d="M 250 270 Q 360 170 420 200 Q 370 280 320 340 Z" fill="url(#wing-grad)" stroke="#20052C" stroke-width="2"/>
          <!-- Warrior Kimono Mantle & Torso -->
          <path d="M 195 380 L 220 260 L 280 260 L 305 380 Z" fill="url(#body-grad)" stroke="#20052C" stroke-width="2"/>
          <!-- Crossed Martial Collar Lapels -->
          <path d="M 215 260 L 265 340 M 285 260 L 235 340" stroke="#E5B8F4" stroke-width="3"/>
          <!-- Tengu Head Visage -->
          <ellipse cx="250" cy="185" rx="38" ry="32" fill="url(#body-grad)" stroke="#20052C" stroke-width="2"/>
          <!-- Prominent Crow Beak or High Mask Nose -->
          <polygon points="242,185 258,185 250,225" fill="#E5B8F4" stroke="#20052C" stroke-width="1.5"/>
          <!-- Yamabushi Tokin Pillbox Hat -->
          <polygon points="230,150 270,150 265,130 235,130" fill="#20052C" stroke="#E5B8F4" stroke-width="2"/>
          <circle cx="250" cy="140" r="4" fill="#AF52DE"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#F3E5F5"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#F3E5F5"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Sun Flame Mark -->
        <path d="M 250 142 Q 256 150 250 162 Q 244 150 250 142 Z" fill="#E5B8F4" stroke="#AF52DE" stroke-width="1.2" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Imperial Jade Dragon Seal -->
        <g transform="translate(100, 320)">
          <rect x="0" y="10" width="34" height="26" rx="4" fill="#AF52DE" stroke="#E5B8F4" stroke-width="2" filter="url(#glow)"/>
          <path d="M 8 10 Q 17 -6 26 10" stroke="#E5B8F4" stroke-width="3" fill="none"/>
          <circle cx="17" cy="22" r="5" fill="#E5B8F4"/>
        </g>
        
</svg>