<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#591F56"/>
      <stop offset="55%" stop-color="#2E153B"/>
      <stop offset="100%" stop-color="#120B1A"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF8E1"/>
      <stop offset="85%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6F00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFE082" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2B1600" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="35%" stop-color="#FFB74D"/>
      <stop offset="75%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#2B1600"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#2B1600"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FF6F00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FF6F00"/>
      <stop offset="70%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#2B1600"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Layered Mountain Peaks & Floating Isles -->
        <path d="M 0 320 Q 90 210 180 280 T 360 250 T 500 310 L 500 500 L 0 500 Z" fill="#2B1600" opacity="0.8"/>
        <path d="M 80 290 Q 180 180 280 270 T 460 240 L 500 300 L 500 500 L 0 500 Z" fill="#2E153B" opacity="0.5"/>
        <ellipse cx="120" cy="140" rx="45" ry="14" fill="#2B1600" opacity="0.85"/>
        <ellipse cx="380" cy="120" rx="55" ry="16" fill="#2B1600" opacity="0.85"/>
        <circle cx="250" cy="190" r="110" fill="#FF6F00" opacity="0.18" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="195" stroke="#FF6F00" stroke-width="3" fill="none" opacity="0.65"/>
        <path d="M 80 200 Q 140 160 200 210 Q 250 170 300 210 Q 360 160 420 200" stroke="#FFE082" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
        <circle cx="250" cy="220" r="178" stroke="#FFB74D" stroke-width="1.5" fill="none" stroke-dasharray="12 6" opacity="0.6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#FF6F00" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#FFF8E1" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#FFB74D"/>
        <circle cx="430" cy="340" r="3.5" fill="#FF6F00"/>
        <circle cx="160" cy="70" r="2.5" fill="#FFE082"/>
        <circle cx="340" cy="65" r="3" fill="#FF6F00"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FF6F00" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFF8E1" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#2B1600" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#2E153B" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#FFB74D" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tortoise-body">
          <!-- Great Fortress Carapace Carved Shell -->
          <path d="M 140 380 Q 130 220 250 200 Q 370 220 360 380 Z" fill="url(#body-grad)" stroke="#2B1600" stroke-width="3"/>
          <!-- Hexagonal Shell Scutes -->
          <polygon points="250,225 280,245 280,285 250,305 220,285 220,245" fill="#2B1600" stroke="#FF6F00" stroke-width="2"/>
          <polygon points="250,315 280,335 280,375 250,395 220,375 220,335" fill="#2B1600" stroke="#FF6F00" stroke-width="2"/>
          <polygon points="185,265 215,285 215,325 185,345 155,325 155,285" fill="#2B1600" stroke="#FF6F00" stroke-width="2"/>
          <polygon points="315,265 345,285 345,325 315,345 285,325 285,285" fill="#2B1600" stroke="#FF6F00" stroke-width="2"/>
          <!-- Tortoise Ancient Head -->
          <ellipse cx="250" cy="180" rx="34" ry="26" fill="url(#body-grad)" stroke="#2B1600" stroke-width="2"/>
          <!-- Bearded Chin & Shell Crest -->
          <path d="M 238 200 Q 250 225 262 200" stroke="#FF6F00" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Intertwined Divine Serpent Coiling Overhead -->
          <path d="M 150 340 C 120 250 170 140 220 110 C 260 85 310 95 330 135 C 345 165 330 215 365 290"
                stroke="url(#wing-grad)" stroke-width="16" fill="none" stroke-linecap="round"/>
          <ellipse cx="230" cy="105" rx="14" ry="10" fill="#FFB74D" stroke="#FF6F00" stroke-width="1.5"/>
          <circle cx="234" cy="103" r="2.5" fill="#FFF8E1"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Imperial Golden Phoenix Coronet -->
        <g transform="translate(250, 130)">
          <path d="M -25 0 Q 0 -22 25 0 L 20 8 Q 0 -10 -20 8 Z" fill="#FF6F00" stroke="#2B1600" stroke-width="1.5"/>
          <circle cx="0" cy="-14" r="5" fill="#FFB74D" filter="url(#glow)"/>
          <line x1="-15" y1="0" x2="-22" y2="18" stroke="#FF6F00" stroke-width="2"/>
          <line x1="15" y1="0" x2="22" y2="18" stroke="#FF6F00" stroke-width="2"/>
        </g>
        

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Laozi Thunder Gourd -->
        <g transform="translate(370, 320)">
          <ellipse cx="14" cy="14" rx="10" ry="9" fill="#FF6F00" stroke="#2B1600" stroke-width="1.5"/>
          <ellipse cx="14" cy="28" rx="15" ry="14" fill="#FF6F00" stroke="#2B1600" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#FFB74D" stroke-width="2.5"/>
        </g>
        
</svg>