<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0E381C"/>
      <stop offset="55%" stop-color="#072010"/>
      <stop offset="100%" stop-color="#030E07"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#90A4AE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ECEFF1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#172026" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="35%" stop-color="#CFD8DC"/>
      <stop offset="75%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#172026"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#172026"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#90A4AE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ECEFF1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#90A4AE"/>
      <stop offset="70%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#172026"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Solar Eclipse Coronal Flare -->
        <circle cx="250" cy="205" r="145" fill="#90A4AE" opacity="0.3" filter="url(#bright-glow)"/>
        <circle cx="250" cy="205" r="115" stroke="#90A4AE" stroke-width="12" fill="none" opacity="0.8" stroke-dasharray="14 8"/>
        <circle cx="250" cy="205" r="110" fill="#172026"/>
        <polygon points="250,75 256,105 250,98 244,105" fill="#90A4AE" filter="url(#glow)"/>
        <polygon points="380,205 350,211 357,205 350,199" fill="#90A4AE" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#90A4AE" stroke-width="2" fill="none" opacity="0.7" transform="rotate(-25 250 220)"/>
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#ECEFF1" stroke-width="2" fill="none" opacity="0.7" transform="rotate(35 250 220)"/>
        <circle cx="85" cy="165" r="7" fill="#90A4AE" filter="url(#glow)"/>
        <circle cx="410" cy="285" r="9" fill="#CFD8DC" filter="url(#glow)"/>
        <circle cx="395" cy="140" r="6" fill="#FFFFFF"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#90A4AE" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#FFFFFF" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#CFD8DC"/>
        <circle cx="430" cy="340" r="3.5" fill="#90A4AE"/>
        <circle cx="160" cy="70" r="2.5" fill="#ECEFF1"/>
        <circle cx="340" cy="65" r="3" fill="#90A4AE"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#90A4AE" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#172026" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#072010" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#CFD8DC" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="dragon-body">
          <!-- Serpentine S-Curve Dragon Body -->
          <path d="M 130 380 C 120 280 180 210 220 180 C 250 160 270 170 290 200 C 320 250 380 310 370 390"
                stroke="url(#body-grad)" stroke-width="60" stroke-linecap="round" fill="none"/>
          <!-- Dragon Ventral Scales -->
          <path d="M 130 380 C 120 280 180 210 220 180 C 250 160 270 170 290 200 C 320 250 380 310 370 390"
                stroke="url(#belly-grad)" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.95"/>
          <!-- Dorsal Spines -->
          <path d="M 125 360 L 105 350 L 130 330 L 115 315 L 145 295 L 135 275 L 175 250 L 170 230 L 210 205"
                stroke="#90A4AE" stroke-width="3" fill="#CFD8DC" opacity="0.9"/>
          <!-- Dragon Head & Jaw -->
          <path d="M 210 175 C 195 135 240 100 270 115 C 295 130 305 160 285 185 Z" fill="url(#body-grad)" stroke="#172026" stroke-width="2.5"/>
          <!-- Snout & Whisker Barbel -->
          <path d="M 270 135 Q 355 125 395 175 M 275 145 Q 345 155 385 205" stroke="#90A4AE" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <path d="M 220 145 Q 165 140 125 185" stroke="#90A4AE" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Imperial Antlers -->
          <path d="M 230 115 Q 185 65 150 70 M 175 90 Q 155 110 140 115" stroke="#90A4AE" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 265 110 Q 300 55 340 55 M 285 85 Q 315 100 335 105" stroke="#90A4AE" stroke-width="5" stroke-linecap="round" fill="none"/>
          <!-- Dragon Claws Extended -->
          <g transform="translate(130, 310)">
            <path d="M 0 0 L 25 15 M 5 15 L 30 30 M -10 10 L 15 25" stroke="#90A4AE" stroke-width="4.5" stroke-linecap="round"/>
          </g>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Imperial Golden Phoenix Coronet -->
        <g transform="translate(250, 130)">
          <path d="M -25 0 Q 0 -22 25 0 L 20 8 Q 0 -10 -20 8 Z" fill="#90A4AE" stroke="#172026" stroke-width="1.5"/>
          <circle cx="0" cy="-14" r="5" fill="#CFD8DC" filter="url(#glow)"/>
          <line x1="-15" y1="0" x2="-22" y2="18" stroke="#90A4AE" stroke-width="2"/>
          <line x1="15" y1="0" x2="22" y2="18" stroke="#90A4AE" stroke-width="2"/>
        </g>
        

  <!-- Forehead Glyph -->
  
        <!-- Sun Flame Mark -->
        <path d="M 250 142 Q 256 150 250 162 Q 244 150 250 142 Z" fill="#90A4AE" stroke="#CFD8DC" stroke-width="1.2" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Bronze Scrying Mirror -->
        <circle cx="380" cy="330" r="20" fill="#172026" stroke="#90A4AE" stroke-width="3" filter="url(#glow)"/>
        <circle cx="380" cy="330" r="14" fill="#90A4AE" opacity="0.4"/>
        <circle cx="380" cy="330" r="6" fill="#FFFFFF"/>
        
</svg>