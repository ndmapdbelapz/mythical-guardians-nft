<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#5E1812"/>
      <stop offset="55%" stop-color="#350F0B"/>
      <stop offset="100%" stop-color="#180605"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFCCBC"/>
      <stop offset="85%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#D84315"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAB91" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF7043" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#280A02" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="35%" stop-color="#D84315"/>
      <stop offset="75%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#280A02"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="50%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#280A02"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCCBC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFAB91" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFAB91"/>
      <stop offset="70%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#280A02"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Torii Gate Silhouette & Diagonal Rays -->
        <circle cx="250" cy="210" r="125" fill="#D84315" opacity="0.22" filter="url(#glow)"/>
        <g opacity="0.45" stroke="#FFAB91" stroke-width="1.5">
          <line x1="250" y1="210" x2="40" y2="40"/>
          <line x1="250" y1="210" x2="460" y2="40"/>
          <line x1="250" y1="210" x2="10" y2="180"/>
          <line x1="250" y1="210" x2="490" y2="180"/>
        </g>
        <!-- Distant Torii Silhouette -->
        <path d="M 175 140 L 325 140 M 185 155 L 315 155 M 200 140 L 200 240 M 300 140 L 300 240" stroke="#280A02" stroke-width="7" stroke-linecap="square"/>
        

  <!-- Sacred Halo Geometry -->
  
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#FFAB91" stroke-width="2" fill="none" opacity="0.7" transform="rotate(-25 250 220)"/>
        <ellipse cx="250" cy="220" rx="215" ry="85" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.7" transform="rotate(35 250 220)"/>
        <circle cx="85" cy="165" r="7" fill="#FFAB91" filter="url(#glow)"/>
        <circle cx="410" cy="285" r="9" fill="#D84315" filter="url(#glow)"/>
        <circle cx="395" cy="140" r="6" fill="#FFCCBC"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <path d="M 60 70 L 105 140 L 85 150 L 140 230 M 430 80 L 390 145 L 410 155 L 365 240" stroke="#FFAB91" stroke-width="3" fill="none" opacity="0.9" filter="url(#glow)"/>
        <path d="M 130 50 L 160 100 L 150 108 L 180 160 M 330 40 L 310 95 L 325 105 L 295 170" stroke="#FFCCBC" stroke-width="2" fill="none" opacity="0.95"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FFAB91" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFCCBC" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#280A02" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#350F0B" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#D84315" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="garuda-body">
          <!-- Solar Eagle Grand Wings -->
          <path d="M 250 260 Q 150 140 60 160 Q 120 250 180 320 Z" fill="url(#wing-grad)" stroke="#FFAB91" stroke-width="2"/>
          <path d="M 250 260 Q 350 140 440 160 Q 380 250 320 320 Z" fill="url(#wing-grad)" stroke="#FFAB91" stroke-width="2"/>
          <!-- Torso & Golden Armor Gorget -->
          <path d="M 205 380 Q 215 240 250 230 Q 285 240 295 380 Z" fill="url(#body-grad)" stroke="#280A02" stroke-width="2"/>
          <!-- Armored Chest Breastplate -->
          <polygon points="250,250 280,270 270,310 250,325 230,310 220,270" fill="#280A02" stroke="#FFAB91" stroke-width="2.5"/>
          <circle cx="250" cy="285" r="8" fill="#FFAB91" filter="url(#glow)"/>
          <!-- Garuda Raptor Head -->
          <circle cx="250" cy="165" r="32" fill="url(#body-grad)" stroke="#280A02" stroke-width="2"/>
          <!-- Hooked Sun-Eagle Beak -->
          <path d="M 240 170 Q 250 170 255 180 Q 252 205 245 210 Q 242 195 240 180 Z" fill="#FFAB91" stroke="#280A02" stroke-width="1.5"/>
          <!-- Solar Sun Wheel Crown Spikes -->
          <path d="M 225 140 L 210 95 M 240 135 L 235 85 M 255 135 L 260 85 M 270 140 L 285 95" stroke="#FFAB91" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#FFCCBC"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#FFCCBC"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Vermilion War Fan -->
        <path d="M 350 350 L 390 300 A 30 30 0 0 1 420 340 Z" fill="#D84315" stroke="#FFAB91" stroke-width="2" filter="url(#glow)"/>
        <line x1="350" y1="350" x2="385" y2="310" stroke="#FFAB91" stroke-width="1.5"/>
        <line x1="350" y1="350" x2="405" y2="325" stroke="#FFAB91" stroke-width="1.5"/>
        
</svg>