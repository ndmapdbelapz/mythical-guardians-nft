<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0E381C"/>
      <stop offset="55%" stop-color="#072010"/>
      <stop offset="100%" stop-color="#030E07"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ACC1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#80DEEA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#031B24" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ACC1"/>
      <stop offset="35%" stop-color="#E0F7FA"/>
      <stop offset="75%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#031B24"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#00ACC1"/>
      <stop offset="50%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#031B24"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00ACC1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#80DEEA" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00ACC1"/>
      <stop offset="70%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#031B24"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Solar Eclipse Coronal Flare -->
        <circle cx="250" cy="205" r="145" fill="#00ACC1" opacity="0.3" filter="url(#bright-glow)"/>
        <circle cx="250" cy="205" r="115" stroke="#00ACC1" stroke-width="12" fill="none" opacity="0.8" stroke-dasharray="14 8"/>
        <circle cx="250" cy="205" r="110" fill="#031B24"/>
        <polygon points="250,75 256,105 250,98 244,105" fill="#00ACC1" filter="url(#glow)"/>
        <polygon points="380,205 350,211 357,205 350,199" fill="#00ACC1" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#00ACC1" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#80DEEA" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#E0F7FA" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#80DEEA" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#80DEEA" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#00ACC1" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#80DEEA" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#80DEEA" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#00ACC1" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#031B24" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#072010" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#E0F7FA" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="garuda-body">
          <!-- Solar Eagle Grand Wings -->
          <path d="M 250 260 Q 150 140 60 160 Q 120 250 180 320 Z" fill="url(#wing-grad)" stroke="#00ACC1" stroke-width="2"/>
          <path d="M 250 260 Q 350 140 440 160 Q 380 250 320 320 Z" fill="url(#wing-grad)" stroke="#00ACC1" stroke-width="2"/>
          <!-- Torso & Golden Armor Gorget -->
          <path d="M 205 380 Q 215 240 250 230 Q 285 240 295 380 Z" fill="url(#body-grad)" stroke="#031B24" stroke-width="2"/>
          <!-- Armored Chest Breastplate -->
          <polygon points="250,250 280,270 270,310 250,325 230,310 220,270" fill="#031B24" stroke="#00ACC1" stroke-width="2.5"/>
          <circle cx="250" cy="285" r="8" fill="#00ACC1" filter="url(#glow)"/>
          <!-- Garuda Raptor Head -->
          <circle cx="250" cy="165" r="32" fill="url(#body-grad)" stroke="#031B24" stroke-width="2"/>
          <!-- Hooked Sun-Eagle Beak -->
          <path d="M 240 170 Q 250 170 255 180 Q 252 205 245 210 Q 242 195 240 180 Z" fill="#00ACC1" stroke="#031B24" stroke-width="1.5"/>
          <!-- Solar Sun Wheel Crown Spikes -->
          <path d="M 225 140 L 210 95 M 240 135 L 235 85 M 255 135 L 260 85 M 270 140 L 285 95" stroke="#00ACC1" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Tilted Porcelain Kitsune Spirit Mask -->
        <g transform="translate(265, 120) rotate(18)">
          <ellipse cx="0" cy="0" rx="22" ry="16" fill="#FFFFFF" stroke="#E0F7FA" stroke-width="2"/>
          <polygon points="-14,-14 -8,-24 0,-14" fill="#FFFFFF" stroke="#E0F7FA" stroke-width="1.5"/>
          <polygon points="14,-14 8,-24 0,-14" fill="#FFFFFF" stroke="#E0F7FA" stroke-width="1.5"/>
          <path d="M -8 -2 Q -4 4 0 -2 M 8 -2 Q 4 4 0 -2" stroke="#E0F7FA" stroke-width="2" fill="none"/>
          <circle cx="0" cy="6" r="2" fill="#031B24"/>
        </g>
        

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Bronze Scrying Mirror -->
        <circle cx="380" cy="330" r="20" fill="#031B24" stroke="#00ACC1" stroke-width="3" filter="url(#glow)"/>
        <circle cx="380" cy="330" r="14" fill="#00ACC1" opacity="0.4"/>
        <circle cx="380" cy="330" r="6" fill="#FFFFFF"/>
        
</svg>