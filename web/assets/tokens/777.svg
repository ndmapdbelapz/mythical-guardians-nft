<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#4F370C"/>
      <stop offset="55%" stop-color="#2F2107"/>
      <stop offset="100%" stop-color="#150F03"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EA80FC"/>
      <stop offset="85%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#AA00FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#20032C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="35%" stop-color="#D500F9"/>
      <stop offset="75%" stop-color="#AA00FF"/>
      <stop offset="100%" stop-color="#20032C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#D500F9"/>
      <stop offset="100%" stop-color="#20032C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA80FC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#AA00FF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#7C4DFF"/>
      <stop offset="70%" stop-color="#D500F9"/>
      <stop offset="100%" stop-color="#20032C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Zodiac Constellation Star Chart -->
        <circle cx="250" cy="210" r="130" stroke="#7C4DFF" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>
        <g stroke="#EA80FC" stroke-width="1" opacity="0.75" fill="#EA80FC">
          <line x1="120" y1="120" x2="180" y2="90"/>
          <line x1="180" y1="90" x2="250" y2="110"/>
          <line x1="250" y1="110" x2="320" y2="80"/>
          <line x1="320" y1="80" x2="380" y2="130"/>
          <circle cx="120" cy="120" r="3.5"/>
          <circle cx="180" cy="90" r="4.5"/>
          <circle cx="250" cy="110" r="5.5"/>
          <circle cx="320" cy="80" r="4"/>
          <circle cx="380" cy="130" r="3.5"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#7C4DFF" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#AA00FF" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#D500F9" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <polygon points="90,110 98,140 106,110 98,80" fill="#7C4DFF" opacity="0.9" filter="url(#glow)"/>
        <polygon points="400,120 408,150 416,120 408,90" fill="#7C4DFF" opacity="0.9" filter="url(#glow)"/>
        <polygon points="120,310 126,330 132,310 126,290" fill="#EA80FC" opacity="0.85"/>
        <polygon points="380,300 386,320 392,300 386,280" fill="#EA80FC" opacity="0.85"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#7C4DFF" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#EA80FC" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#20032C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#2F2107" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#D500F9" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="dragon-body">
          <!-- Serpentine S-Curve Dragon Body -->
          <path d="M 130 380 C 120 280 180 210 220 180 C 250 160 270 170 290 200 C 320 250 380 310 370 390"
                stroke="url(#body-grad)" stroke-width="60" stroke-linecap="round" fill="none"/>
          <!-- Dragon Ventral Scales -->
          <path d="M 130 380 C 120 280 180 210 220 180 C 250 160 270 170 290 200 C 320 250 380 310 370 390"
                stroke="url(#belly-grad)" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.95"/>
          <!-- Dorsal Spines -->
          <path d="M 125 360 L 105 350 L 130 330 L 115 315 L 145 295 L 135 275 L 175 250 L 170 230 L 210 205"
                stroke="#7C4DFF" stroke-width="3" fill="#D500F9" opacity="0.9"/>
          <!-- Dragon Head & Jaw -->
          <path d="M 210 175 C 195 135 240 100 270 115 C 295 130 305 160 285 185 Z" fill="url(#body-grad)" stroke="#20032C" stroke-width="2.5"/>
          <!-- Snout & Whisker Barbel -->
          <path d="M 270 135 Q 355 125 395 175 M 275 145 Q 345 155 385 205" stroke="#7C4DFF" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <path d="M 220 145 Q 165 140 125 185" stroke="#7C4DFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Imperial Antlers -->
          <path d="M 230 115 Q 185 65 150 70 M 175 90 Q 155 110 140 115" stroke="#7C4DFF" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 265 110 Q 300 55 340 55 M 285 85 Q 315 100 335 105" stroke="#7C4DFF" stroke-width="5" stroke-linecap="round" fill="none"/>
          <!-- Dragon Claws Extended -->
          <g transform="translate(130, 310)">
            <path d="M 0 0 L 25 15 M 5 15 L 30 30 M -10 10 L 15 25" stroke="#7C4DFF" stroke-width="4.5" stroke-linecap="round"/>
          </g>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#20032C" stroke="#7C4DFF" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#20032C" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#20032C" stroke="#7C4DFF" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#20032C" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <g transform="translate(250, 132)">
          <ellipse cx="0" cy="0" rx="28" ry="6" fill="#20032C" stroke="#7C4DFF" stroke-width="2"/>
          <circle cx="0" cy="-6" r="6" fill="url(#orb-grad)" filter="url(#glow)"/>
          <circle cx="-16" cy="-4" r="4" fill="#EA80FC"/>
          <circle cx="16" cy="-4" r="4" fill="#EA80FC"/>
        </g>
        

  <!-- Forehead Glyph -->
  
        <!-- Taiji Yin-Yang Mark -->
        <g transform="translate(250, 155)">
          <circle cx="0" cy="0" r="9" fill="#7C4DFF" stroke="#20032C" stroke-width="1" filter="url(#glow)"/>
          <path d="M 0 -9 A 4.5 4.5 0 0 1 0 0 A 4.5 4.5 0 0 0 0 9 A 9 9 0 0 1 0 -9" fill="#20032C"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Bronze Scrying Mirror -->
        <circle cx="380" cy="330" r="20" fill="#20032C" stroke="#7C4DFF" stroke-width="3" filter="url(#glow)"/>
        <circle cx="380" cy="330" r="14" fill="#7C4DFF" opacity="0.4"/>
        <circle cx="380" cy="330" r="6" fill="#EA80FC"/>
        
</svg>