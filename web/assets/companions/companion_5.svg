<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="comp-bg-5" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#123F4E"/>
      <stop offset="60%" stop-color="#051A21"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <filter id="comp-glow-5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Sacred Space Canvas -->
  <rect width="500" height="500" fill="url(#comp-bg-5)"/>

  <!-- Celestial Constellation Dust -->
  <g opacity="0.4" fill="#FFFFFF">
    <circle cx="90" cy="80" r="1.5"/>
    <circle cx="410" cy="110" r="2"/>
    <circle cx="70" cy="390" r="1.5"/>
    <circle cx="420" cy="410" r="2.5"/>
    <circle cx="130" cy="230" r="1"/>
    <circle cx="370" cy="260" r="1.5"/>
  </g>

  <!-- Sacred Mandalas of Awakening -->
  <circle cx="250" cy="250" r="210" stroke="#70E4EF" stroke-width="1.5" stroke-dasharray="10 8" fill="none" opacity="0.6"/>
  <circle cx="250" cy="250" r="185" stroke="#E0F7FA" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="250" cy="250" r="160" stroke="#70E4EF" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.5"/>

  <!-- Rotating Sacred Trigram Points -->
  <g stroke="#70E4EF" stroke-width="1.5" opacity="0.7">
    <line x1="250" y1="35" x2="250" y2="55"/>
    <line x1="250" y1="445" x2="250" y2="465"/>
    <line x1="35" y1="250" x2="55" y2="250"/>
    <line x1="445" y1="250" x2="465" y2="250"/>
  </g>

  <!-- Divine Familiar Core Entity -->
  <g filter="url(#comp-glow-5)">
    <circle cx="250" cy="250" r="75" fill="#00C7BE" opacity="0.85"/>
    <circle cx="250" cy="250" r="50" fill="#70E4EF" opacity="0.9"/>
    <circle cx="250" cy="250" r="22" fill="#FFFFFF"/>

    <!-- Sacred Triquetra Crest -->
    <path d="M 250 185 Q 285 240 250 295 Q 215 240 250 185 Z" fill="#E0F7FA" opacity="0.8"/>

    <!-- Orbital Spirit Wisps -->
    <circle cx="170" cy="190" r="14" fill="#E0F7FA"/>
    <circle cx="170" cy="190" r="6" fill="#FFF"/>
    <circle cx="330" cy="190" r="14" fill="#E0F7FA"/>
    <circle cx="330" cy="190" r="6" fill="#FFF"/>
    <circle cx="250" cy="340" r="18" fill="#70E4EF"/>
    <circle cx="250" cy="340" r="8" fill="#FFF"/>

    <!-- Celestial Crown Petals -->
    <polygon points="250,130 264,155 236,155" fill="#70E4EF"/>
    <polygon points="190,150 208,170 182,175" fill="#70E4EF"/>
    <polygon points="310,150 318,175 292,170" fill="#70E4EF"/>
  </g>
</svg>