<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#4F370C"/>
      <stop offset="55%" stop-color="#2F2107"/>
      <stop offset="100%" stop-color="#150F03"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3E5F5"/>
      <stop offset="85%" stop-color="#E5B8F4"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B8F4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#BF5AF2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#20052C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B8F4"/>
      <stop offset="35%" stop-color="#AF52DE"/>
      <stop offset="75%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#20052C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E5B8F4"/>
      <stop offset="50%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#20052C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E5F5" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E5B8F4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E5B8F4"/>
      <stop offset="70%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#20052C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Zodiac Constellation Star Chart -->
        <circle cx="250" cy="210" r="130" stroke="#E5B8F4" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>
        <g stroke="#F3E5F5" stroke-width="1" opacity="0.75" fill="#F3E5F5">
          <line x1="120" y1="120" x2="180" y2="90"/>
          <line x1="180" y1="90" x2="250" y2="110"/>
          <line x1="250" y1="110" x2="320" y2="80"/>
          <line x1="320" y1="80" x2="380" y2="130"/>
          <circle cx="120" cy="120" r="3.5"/>
          <circle cx="180" cy="90" r="4.5"/>
          <circle cx="250" cy="110" r="5.5"/>
          <circle cx="320" cy="80" r="4"/>
          <circle cx="380" cy="130" r="3.5"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="195" stroke="#E5B8F4" stroke-width="3" fill="none" opacity="0.65"/>
        <path d="M 80 200 Q 140 160 200 210 Q 250 170 300 210 Q 360 160 420 200" stroke="#BF5AF2" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
        <circle cx="250" cy="220" r="178" stroke="#AF52DE" stroke-width="1.5" fill="none" stroke-dasharray="12 6" opacity="0.6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#E5B8F4" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#F3E5F5" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#AF52DE"/>
        <circle cx="430" cy="340" r="3.5" fill="#E5B8F4"/>
        <circle cx="160" cy="70" r="2.5" fill="#BF5AF2"/>
        <circle cx="340" cy="65" r="3" fill="#E5B8F4"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#E5B8F4" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#F3E5F5" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#20052C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#2F2107" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#AF52DE" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="garuda-body">
          <!-- Solar Eagle Grand Wings -->
          <path d="M 250 260 Q 150 140 60 160 Q 120 250 180 320 Z" fill="url(#wing-grad)" stroke="#E5B8F4" stroke-width="2"/>
          <path d="M 250 260 Q 350 140 440 160 Q 380 250 320 320 Z" fill="url(#wing-grad)" stroke="#E5B8F4" stroke-width="2"/>
          <!-- Torso & Golden Armor Gorget -->
          <path d="M 205 380 Q 215 240 250 230 Q 285 240 295 380 Z" fill="url(#body-grad)" stroke="#20052C" stroke-width="2"/>
          <!-- Armored Chest Breastplate -->
          <polygon points="250,250 280,270 270,310 250,325 230,310 220,270" fill="#20052C" stroke="#E5B8F4" stroke-width="2.5"/>
          <circle cx="250" cy="285" r="8" fill="#E5B8F4" filter="url(#glow)"/>
          <!-- Garuda Raptor Head -->
          <circle cx="250" cy="165" r="32" fill="url(#body-grad)" stroke="#20052C" stroke-width="2"/>
          <!-- Hooked Sun-Eagle Beak -->
          <path d="M 240 170 Q 250 170 255 180 Q 252 205 245 210 Q 242 195 240 180 Z" fill="#E5B8F4" stroke="#20052C" stroke-width="1.5"/>
          <!-- Solar Sun Wheel Crown Spikes -->
          <path d="M 225 140 L 210 95 M 240 135 L 235 85 M 255 135 L 260 85 M 270 140 L 285 95" stroke="#E5B8F4" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#E040FB" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#F3E5F5"/>
        <circle cx="268" cy="170" r="7" fill="#E040FB" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#F3E5F5"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <circle cx="250" cy="154" r="4.5" fill="#F3E5F5" stroke="#E5B8F4" stroke-width="1.5" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Celestial Vajra / Sword Relic -->
        <g transform="translate(110, 320)">
          <line x1="0" y1="35" x2="28" y2="0" stroke="#E5B8F4" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
          <circle cx="14" cy="18" r="6" fill="#AF52DE" stroke="#F3E5F5" stroke-width="1.5"/>
        </g>
        
</svg>