<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#5E1812"/>
      <stop offset="55%" stop-color="#350F0B"/>
      <stop offset="100%" stop-color="#180605"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F7FA"/>
      <stop offset="85%" stop-color="#64D2FF"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5AC8FA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#021A33" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="35%" stop-color="#007AFF"/>
      <stop offset="75%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#021A33"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#021A33"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#64D2FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5AC8FA" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#64D2FF"/>
      <stop offset="70%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#021A33"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Torii Gate Silhouette & Diagonal Rays -->
        <circle cx="250" cy="210" r="125" fill="#007AFF" opacity="0.22" filter="url(#glow)"/>
        <g opacity="0.45" stroke="#64D2FF" stroke-width="1.5">
          <line x1="250" y1="210" x2="40" y2="40"/>
          <line x1="250" y1="210" x2="460" y2="40"/>
          <line x1="250" y1="210" x2="10" y2="180"/>
          <line x1="250" y1="210" x2="490" y2="180"/>
        </g>
        <!-- Distant Torii Silhouette -->
        <path d="M 175 140 L 325 140 M 185 155 L 315 155 M 200 140 L 200 240 M 300 140 L 300 240" stroke="#021A33" stroke-width="7" stroke-linecap="square"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="195" stroke="#64D2FF" stroke-width="3" fill="none" opacity="0.65"/>
        <path d="M 80 200 Q 140 160 200 210 Q 250 170 300 210 Q 360 160 420 200" stroke="#5AC8FA" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
        <circle cx="250" cy="220" r="178" stroke="#007AFF" stroke-width="1.5" fill="none" stroke-dasharray="12 6" opacity="0.6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="80" cy="180" r="18" fill="#007AFF" opacity="0.8" filter="url(#glow)"/>
        <circle cx="80" cy="180" r="8" fill="#64D2FF"/>
        <circle cx="420" cy="170" r="20" fill="#007AFF" opacity="0.8" filter="url(#glow)"/>
        <circle cx="420" cy="170" r="9" fill="#64D2FF"/>
        <circle cx="250" cy="85" r="14" fill="#5AC8FA" opacity="0.85" filter="url(#glow)"/>
        <circle cx="250" cy="85" r="6" fill="#E0F7FA"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#64D2FF" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#E0F7FA" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#021A33" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#350F0B" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#007AFF" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="kitsune-body">
          <!-- Majestic Arc of Nine Voluminous Bushy Tails -->
          <g filter="url(#glow)">
            <path d="M 250 340 Q 140 330 75 280" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 120 280 80 200" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 130 210 115 130" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 170 160 170 85" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 250 140 250 65" stroke="url(#wing-grad)" stroke-width="26" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 330 160 330 85" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 370 210 385 130" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 380 280 420 200" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
            <path d="M 250 340 Q 360 330 425 280" stroke="url(#wing-grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
          </g>
          <!-- Kitsune Torso & Slender Silhouette -->
          <path d="M 205 380 Q 220 260 250 240 Q 280 260 295 380 Z" fill="url(#body-grad)" stroke="#021A33" stroke-width="2"/>
          <!-- Pointed Fox Ears -->
          <polygon points="215,165 190,95 240,140" fill="url(#body-grad)" stroke="#021A33" stroke-width="1.8"/>
          <polygon points="212,155 198,108 230,138" fill="#007AFF"/>
          <polygon points="285,165 310,95 260,140" fill="url(#body-grad)" stroke="#021A33" stroke-width="1.8"/>
          <polygon points="288,155 302,108 270,138" fill="#007AFF"/>
          <!-- Fox Face & Muzzle -->
          <polygon points="205,170 295,170 250,230" fill="url(#body-grad)" stroke="#021A33" stroke-width="2"/>
          <polygon points="244,222 256,222 250,230" fill="#021A33"/>
          <!-- Cheek Whiskers -->
          <path d="M 215 195 L 180 190 M 215 205 L 185 210" stroke="#64D2FF" stroke-width="2" stroke-linecap="round"/>
          <path d="M 285 195 L 320 190 M 285 205 L 315 210" stroke="#64D2FF" stroke-width="2" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Radiant Orb Pupils -->
        <circle cx="232" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="232" cy="170" r="2.5" fill="#FFFFFF"/>
        <circle cx="268" cy="170" r="6.5" fill="#FF9100" filter="url(#bright-glow)"/>
        <circle cx="268" cy="170" r="2.5" fill="#FFFFFF"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Laozi Thunder Gourd -->
        <g transform="translate(370, 320)">
          <ellipse cx="14" cy="14" rx="10" ry="9" fill="#64D2FF" stroke="#021A33" stroke-width="1.5"/>
          <ellipse cx="14" cy="28" rx="15" ry="14" fill="#64D2FF" stroke="#021A33" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#007AFF" stroke-width="2.5"/>
        </g>
        
</svg>