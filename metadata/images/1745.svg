<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#062244"/>
      <stop offset="55%" stop-color="#031024"/>
      <stop offset="100%" stop-color="#01050D"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C5CAE9"/>
      <stop offset="85%" stop-color="#8C9EFF"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8C9EFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3949AB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080B1C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C9EFF"/>
      <stop offset="35%" stop-color="#1A237E"/>
      <stop offset="75%" stop-color="#3949AB"/>
      <stop offset="100%" stop-color="#080B1C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8C9EFF"/>
      <stop offset="50%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#080B1C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5CAE9" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#8C9EFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3949AB" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#8C9EFF"/>
      <stop offset="70%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#080B1C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Radiant Full Moon with Lunar Corona -->
        <circle cx="250" cy="205" r="140" fill="#C5CAE9" opacity="0.12" filter="url(#glow)"/>
        <circle cx="250" cy="205" r="120" fill="url(#moon-grad)"/>
        <!-- Lunar Maria details -->
        <ellipse cx="230" cy="180" rx="35" ry="25" fill="#080B1C" opacity="0.2"/>
        <ellipse cx="280" cy="225" rx="30" ry="20" fill="#080B1C" opacity="0.18"/>
        <circle cx="205" cy="235" r="16" fill="#080B1C" opacity="0.15"/>
        

  <!-- Sacred Halo Geometry -->
  <g filter="url(#glow)"><line x1="425.0" y1="220.0" x2="460.0" y2="220.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="265.3" x2="435.5" y2="269.7" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="307.5" x2="431.9" y2="325.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="343.7" x2="385.8" y2="355.8" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="371.6" x2="355.0" y2="401.9" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="389.0" x2="299.7" y2="405.5" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="395.0" x2="250.0" y2="430.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="389.0" x2="200.3" y2="405.5" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="371.6" x2="145.0" y2="401.9" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="343.7" x2="114.2" y2="355.8" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="307.5" x2="68.1" y2="325.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="265.3" x2="64.5" y2="269.7" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="75.0" y1="220.0" x2="40.0" y2="220.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="174.7" x2="64.5" y2="170.3" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="132.5" x2="68.1" y2="115.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="96.3" x2="114.2" y2="84.2" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="68.4" x2="145.0" y2="38.1" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="51.0" x2="200.3" y2="34.5" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="45.0" x2="250.0" y2="10.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="51.0" x2="299.7" y2="34.5" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="68.4" x2="355.0" y2="38.1" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="96.3" x2="385.8" y2="84.2" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="132.5" x2="431.9" y2="115.0" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="174.7" x2="435.5" y2="170.3" stroke="#8C9EFF" stroke-width="2" opacity="0.75"/></g><circle cx="250" cy="220" r="170" stroke="#3949AB" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#3949AB" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#3949AB" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#8C9EFF" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#3949AB" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#3949AB" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#8C9EFF" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#C5CAE9" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#080B1C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#031024" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#1A237E" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tengu-body">
          <!-- Black Feathered Yōkai Wings -->
          <path d="M 250 270 Q 140 170 80 200 Q 130 280 180 340 Z" fill="url(#wing-grad)" stroke="#080B1C" stroke-width="2"/>
          <path d="M 250 270 Q 360 170 420 200 Q 370 280 320 340 Z" fill="url(#wing-grad)" stroke="#080B1C" stroke-width="2"/>
          <!-- Warrior Kimono Mantle & Torso -->
          <path d="M 195 380 L 220 260 L 280 260 L 305 380 Z" fill="url(#body-grad)" stroke="#080B1C" stroke-width="2"/>
          <!-- Crossed Martial Collar Lapels -->
          <path d="M 215 260 L 265 340 M 285 260 L 235 340" stroke="#8C9EFF" stroke-width="3"/>
          <!-- Tengu Head Visage -->
          <ellipse cx="250" cy="185" rx="38" ry="32" fill="url(#body-grad)" stroke="#080B1C" stroke-width="2"/>
          <!-- Prominent Crow Beak or High Mask Nose -->
          <polygon points="242,185 258,185 250,225" fill="#8C9EFF" stroke="#080B1C" stroke-width="1.5"/>
          <!-- Yamabushi Tokin Pillbox Hat -->
          <polygon points="230,150 270,150 265,130 235,130" fill="#080B1C" stroke="#8C9EFF" stroke-width="2"/>
          <circle cx="250" cy="140" r="4" fill="#1A237E"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#080B1C" stroke="#8C9EFF" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#080B1C" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#080B1C" stroke="#8C9EFF" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#080B1C" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Taiji Yin-Yang Mark -->
        <g transform="translate(250, 155)">
          <circle cx="0" cy="0" r="9" fill="#8C9EFF" stroke="#080B1C" stroke-width="1" filter="url(#glow)"/>
          <path d="M 0 -9 A 4.5 4.5 0 0 1 0 0 A 4.5 4.5 0 0 0 0 9 A 9 9 0 0 1 0 -9" fill="#080B1C"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Radiant Dragon Pearl Orb -->
        <circle cx="120" cy="330" r="24" fill="url(#orb-grad)" filter="url(#hyper-glow)"/>
        <circle cx="120" cy="330" r="10" fill="#FFFFFF"/>
        <path d="M 100 330 Q 120 300 140 330" stroke="#8C9EFF" stroke-width="2" fill="none" opacity="0.8"/>
        
</svg>