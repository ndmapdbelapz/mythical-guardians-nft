<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0E381C"/>
      <stop offset="55%" stop-color="#072010"/>
      <stop offset="100%" stop-color="#030E07"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F5E9"/>
      <stop offset="85%" stop-color="#B9F6CA"/>
      <stop offset="100%" stop-color="#00C853"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9F6CA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#69F0AE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06240E" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="35%" stop-color="#00C853"/>
      <stop offset="75%" stop-color="#69F0AE"/>
      <stop offset="100%" stop-color="#06240E"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#06240E"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#B9F6CA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#69F0AE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#B9F6CA"/>
      <stop offset="70%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#06240E"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Solar Eclipse Coronal Flare -->
        <circle cx="250" cy="205" r="145" fill="#B9F6CA" opacity="0.3" filter="url(#bright-glow)"/>
        <circle cx="250" cy="205" r="115" stroke="#B9F6CA" stroke-width="12" fill="none" opacity="0.8" stroke-dasharray="14 8"/>
        <circle cx="250" cy="205" r="110" fill="#06240E"/>
        <polygon points="250,75 256,105 250,98 244,105" fill="#B9F6CA" filter="url(#glow)"/>
        <polygon points="380,205 350,211 357,205 350,199" fill="#B9F6CA" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  <g filter="url(#glow)"><line x1="425.0" y1="220.0" x2="460.0" y2="220.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="265.3" x2="435.5" y2="269.7" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="307.5" x2="431.9" y2="325.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="343.7" x2="385.8" y2="355.8" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="371.6" x2="355.0" y2="401.9" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="389.0" x2="299.7" y2="405.5" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="395.0" x2="250.0" y2="430.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="389.0" x2="200.3" y2="405.5" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="371.6" x2="145.0" y2="401.9" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="343.7" x2="114.2" y2="355.8" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="307.5" x2="68.1" y2="325.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="265.3" x2="64.5" y2="269.7" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="75.0" y1="220.0" x2="40.0" y2="220.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="174.7" x2="64.5" y2="170.3" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="132.5" x2="68.1" y2="115.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="96.3" x2="114.2" y2="84.2" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="68.4" x2="145.0" y2="38.1" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="51.0" x2="200.3" y2="34.5" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="45.0" x2="250.0" y2="10.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="51.0" x2="299.7" y2="34.5" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="68.4" x2="355.0" y2="38.1" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="96.3" x2="385.8" y2="84.2" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="132.5" x2="431.9" y2="115.0" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="174.7" x2="435.5" y2="170.3" stroke="#B9F6CA" stroke-width="2" opacity="0.75"/></g><circle cx="250" cy="220" r="170" stroke="#69F0AE" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Weather & Particle Atmosphere -->
  
        <polygon points="90,110 98,140 106,110 98,80" fill="#B9F6CA" opacity="0.9" filter="url(#glow)"/>
        <polygon points="400,120 408,150 416,120 408,90" fill="#B9F6CA" opacity="0.9" filter="url(#glow)"/>
        <polygon points="120,310 126,330 132,310 126,290" fill="#E8F5E9" opacity="0.85"/>
        <polygon points="380,300 386,320 392,300 386,280" fill="#E8F5E9" opacity="0.85"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#B9F6CA" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#E8F5E9" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#06240E" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#072010" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#00C853" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="phoenix-body">
          <!-- Grand Multi-Tiered Arched Wings -->
          <path d="M 250 250 Q 170 120 70 130 Q 110 210 160 270 Z" fill="url(#wing-grad)" stroke="#B9F6CA" stroke-width="2.5"/>
          <path d="M 250 250 Q 330 120 430 130 Q 390 210 340 270 Z" fill="url(#wing-grad)" stroke="#B9F6CA" stroke-width="2.5"/>
          <!-- Feather Primary Blades -->
          <path d="M 70 130 Q 40 165 65 210 M 95 155 Q 70 195 95 240 M 120 180 Q 95 225 125 270" stroke="#E8F5E9" stroke-width="3" fill="none"/>
          <path d="M 430 130 Q 460 165 435 210 M 405 155 Q 430 195 405 240 M 380 180 Q 405 225 375 270" stroke="#E8F5E9" stroke-width="3" fill="none"/>
          <!-- Phoenix Torso & Golden Breast -->
          <path d="M 220 220 Q 250 180 280 220 Q 285 290 250 335 Q 215 290 220 220 Z" fill="url(#body-grad)" stroke="#06240E" stroke-width="2"/>
          <ellipse cx="250" cy="265" rx="22" ry="38" fill="url(#belly-grad)" opacity="0.9"/>
          <!-- Graceful Neck & Head -->
          <path d="M 240 210 Q 242 165 250 150 Q 258 165 260 210 Z" fill="url(#body-grad)"/>
          <circle cx="250" cy="145" r="18" fill="url(#body-grad)" stroke="#B9F6CA" stroke-width="1.5"/>
          <!-- Golden Raptor Beak -->
          <polygon points="250,148 266,152 250,158" fill="#B9F6CA" stroke="#06240E" stroke-width="1"/>
          <!-- Triple Coronal Crown Feathers -->
          <path d="M 245 130 Q 225 80 205 90 M 250 128 Q 250 70 250 75 M 255 130 Q 275 80 295 90" stroke="#B9F6CA" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <!-- Flowing Cascading Tail Plumes -->
          <path d="M 240 330 Q 200 400 170 470 M 250 335 Q 250 410 250 480 M 260 330 Q 300 400 330 470" stroke="#B9F6CA" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#06240E" stroke="#B9F6CA" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#06240E" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#06240E" stroke="#B9F6CA" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#00E5FF" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#06240E" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Tilted Porcelain Kitsune Spirit Mask -->
        <g transform="translate(265, 120) rotate(18)">
          <ellipse cx="0" cy="0" rx="22" ry="16" fill="#FFFFFF" stroke="#00C853" stroke-width="2"/>
          <polygon points="-14,-14 -8,-24 0,-14" fill="#FFFFFF" stroke="#00C853" stroke-width="1.5"/>
          <polygon points="14,-14 8,-24 0,-14" fill="#FFFFFF" stroke="#00C853" stroke-width="1.5"/>
          <path d="M -8 -2 Q -4 4 0 -2 M 8 -2 Q 4 4 0 -2" stroke="#00C853" stroke-width="2" fill="none"/>
          <circle cx="0" cy="6" r="2" fill="#06240E"/>
        </g>
        

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Radiant Dragon Pearl Orb -->
        <circle cx="120" cy="330" r="24" fill="url(#orb-grad)" filter="url(#hyper-glow)"/>
        <circle cx="120" cy="330" r="10" fill="#FFFFFF"/>
        <path d="M 100 330 Q 120 300 140 330" stroke="#B9F6CA" stroke-width="2" fill="none" opacity="0.8"/>
        
</svg>