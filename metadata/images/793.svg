<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#062244"/>
      <stop offset="55%" stop-color="#031024"/>
      <stop offset="100%" stop-color="#01050D"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CAF0F8"/>
      <stop offset="85%" stop-color="#FF758F"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF758F" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#90E0EF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#03202C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="35%" stop-color="#00B4D8"/>
      <stop offset="75%" stop-color="#90E0EF"/>
      <stop offset="100%" stop-color="#03202C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#03202C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CAF0F8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FF758F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#90E0EF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FF758F"/>
      <stop offset="70%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#03202C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Radiant Full Moon with Lunar Corona -->
        <circle cx="250" cy="205" r="140" fill="#CAF0F8" opacity="0.12" filter="url(#glow)"/>
        <circle cx="250" cy="205" r="120" fill="url(#moon-grad)"/>
        <!-- Lunar Maria details -->
        <ellipse cx="230" cy="180" rx="35" ry="25" fill="#03202C" opacity="0.2"/>
        <ellipse cx="280" cy="225" rx="30" ry="20" fill="#03202C" opacity="0.18"/>
        <circle cx="205" cy="235" r="16" fill="#03202C" opacity="0.15"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="205" stroke="#FF758F" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="16 10"/>
        <circle cx="250" cy="220" r="190" stroke="#90E0EF" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="250" cy="220" r="172" stroke="#00B4D8" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="8 6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="80" cy="180" r="18" fill="#00B4D8" opacity="0.8" filter="url(#glow)"/>
        <circle cx="80" cy="180" r="8" fill="#FF758F"/>
        <circle cx="420" cy="170" r="20" fill="#00B4D8" opacity="0.8" filter="url(#glow)"/>
        <circle cx="420" cy="170" r="9" fill="#FF758F"/>
        <circle cx="250" cy="85" r="14" fill="#90E0EF" opacity="0.85" filter="url(#glow)"/>
        <circle cx="250" cy="85" r="6" fill="#CAF0F8"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#FF758F" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#CAF0F8" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#03202C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#031024" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#00B4D8" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tiger-body">
          <!-- Muscular Tiger Shoulders & Torso -->
          <path d="M 160 380 C 150 290 190 240 250 240 C 310 240 350 290 340 380 Z" fill="url(#body-grad)" stroke="#03202C" stroke-width="2.5"/>
          <!-- Pointed Triangular Ears -->
          <polygon points="190,140 165,85 215,115" fill="url(#body-grad)" stroke="#03202C" stroke-width="2"/>
          <polygon points="185,130 172,95 205,115" fill="#00B4D8"/>
          <polygon points="310,140 335,85 285,115" fill="url(#body-grad)" stroke="#03202C" stroke-width="2"/>
          <polygon points="315,130 328,95 295,115" fill="#00B4D8"/>
          <!-- Tiger Head -->
          <ellipse cx="250" cy="180" rx="68" ry="58" fill="url(#body-grad)" stroke="#03202C" stroke-width="2"/>
          <!-- Muzzle & Snout -->
          <ellipse cx="250" cy="205" rx="30" ry="20" fill="#03202C" stroke="#00B4D8" stroke-width="2"/>
          <polygon points="243,195 257,195 250,205" fill="#FF758F"/>
          <!-- Fierce Curved Fangs -->
          <polygon points="228,215 238,215 233,238" fill="#FFFFFF" stroke="#03202C" stroke-width="1"/>
          <polygon points="272,215 262,215 267,238" fill="#FFFFFF" stroke="#03202C" stroke-width="1"/>
          <!-- Celestial War Stripes -->
          <path d="M 185 160 Q 210 165 220 175 M 315 160 Q 290 165 280 175" stroke="#03202C" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 180 195 Q 210 200 225 205 M 320 195 Q 290 200 275 205" stroke="#03202C" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 195 225 Q 215 228 228 230 M 305 225 Q 285 228 272 230" stroke="#03202C" stroke-width="4" stroke-linecap="round"/>
          <!-- Iron Gorget Collar at Chest -->
          <path d="M 195 270 Q 250 295 305 270 L 290 310 Q 250 335 210 310 Z" fill="#03202C" stroke="#FF758F" stroke-width="2.5"/>
          <circle cx="250" cy="295" r="7" fill="#FF758F" filter="url(#glow)"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#CAF0F8"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#CAF0F8"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Imperial King Glyph '王' -->
        <g transform="translate(239, 148)" stroke="#FF758F" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
          <line x1="0" y1="0" x2="22" y2="0"/>
          <line x1="3" y1="8" x2="19" y2="8"/>
          <line x1="0" y1="16" x2="22" y2="16"/>
          <line x1="11" y1="0" x2="11" y2="16"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Bronze Scrying Mirror -->
        <circle cx="380" cy="330" r="20" fill="#03202C" stroke="#FF758F" stroke-width="3" filter="url(#glow)"/>
        <circle cx="380" cy="330" r="14" fill="#FF758F" opacity="0.4"/>
        <circle cx="380" cy="330" r="6" fill="#CAF0F8"/>
        
</svg>