<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0B4157"/>
      <stop offset="55%" stop-color="#062735"/>
      <stop offset="100%" stop-color="#02121A"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F5E9"/>
      <stop offset="85%" stop-color="#B9F6CA"/>
      <stop offset="100%" stop-color="#00C853"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9F6CA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#69F0AE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06240E" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="35%" stop-color="#00C853"/>
      <stop offset="75%" stop-color="#69F0AE"/>
      <stop offset="100%" stop-color="#06240E"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#06240E"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#B9F6CA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#69F0AE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#B9F6CA"/>
      <stop offset="70%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#06240E"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Celestial Disk & Astral Starfield -->
        <circle cx="250" cy="210" r="135" fill="url(#celestial-disk)"/>
        <g fill="#E8F5E9" opacity="0.8">
          <circle cx="90" cy="80" r="2.5"/><circle cx="410" cy="95" r="3"/>
          <circle cx="140" cy="50" r="2"/><circle cx="360" cy="60" r="2.5"/>
          <circle cx="70" cy="170" r="1.5"/><circle cx="430" cy="190" r="2"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  <circle cx="250" cy="220" r="190" stroke="#69F0AE" stroke-width="1.5" fill="none" opacity="0.5"/><circle cx="440.0" cy="220.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="414.5" cy="315.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="345.0" cy="384.5" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="250.0" cy="410.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="155.0" cy="384.5" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="85.5" cy="315.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="60.0" cy="220.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="85.5" cy="125.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="155.0" cy="55.5" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="250.0" cy="30.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="345.0" cy="55.5" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="414.5" cy="125.0" r="7" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#B9F6CA" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#E8F5E9" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#00C853"/>
        <circle cx="430" cy="340" r="3.5" fill="#B9F6CA"/>
        <circle cx="160" cy="70" r="2.5" fill="#69F0AE"/>
        <circle cx="340" cy="65" r="3" fill="#B9F6CA"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#B9F6CA" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#E8F5E9" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#06240E" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#062735" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#00C853" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tengu-body">
          <!-- Black Feathered Yōkai Wings -->
          <path d="M 250 270 Q 140 170 80 200 Q 130 280 180 340 Z" fill="url(#wing-grad)" stroke="#06240E" stroke-width="2"/>
          <path d="M 250 270 Q 360 170 420 200 Q 370 280 320 340 Z" fill="url(#wing-grad)" stroke="#06240E" stroke-width="2"/>
          <!-- Warrior Kimono Mantle & Torso -->
          <path d="M 195 380 L 220 260 L 280 260 L 305 380 Z" fill="url(#body-grad)" stroke="#06240E" stroke-width="2"/>
          <!-- Crossed Martial Collar Lapels -->
          <path d="M 215 260 L 265 340 M 285 260 L 235 340" stroke="#B9F6CA" stroke-width="3"/>
          <!-- Tengu Head Visage -->
          <ellipse cx="250" cy="185" rx="38" ry="32" fill="url(#body-grad)" stroke="#06240E" stroke-width="2"/>
          <!-- Prominent Crow Beak or High Mask Nose -->
          <polygon points="242,185 258,185 250,225" fill="#B9F6CA" stroke="#06240E" stroke-width="1.5"/>
          <!-- Yamabushi Tokin Pillbox Hat -->
          <polygon points="230,150 270,150 265,130 235,130" fill="#06240E" stroke="#B9F6CA" stroke-width="2"/>
          <circle cx="250" cy="140" r="4" fill="#00C853"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#E8F5E9"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#E8F5E9"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Tilted Porcelain Kitsune Spirit Mask -->
        <g transform="translate(265, 120) rotate(18)">
          <ellipse cx="0" cy="0" rx="22" ry="16" fill="#FFFFFF" stroke="#00C853" stroke-width="2"/>
          <polygon points="-14,-14 -8,-24 0,-14" fill="#FFFFFF" stroke="#00C853" stroke-width="1.5"/>
          <polygon points="14,-14 8,-24 0,-14" fill="#FFFFFF" stroke="#00C853" stroke-width="1.5"/>
          <path d="M -8 -2 Q -4 4 0 -2 M 8 -2 Q 4 4 0 -2" stroke="#00C853" stroke-width="2" fill="none"/>
          <circle cx="0" cy="6" r="2" fill="#06240E"/>
        </g>
        

  <!-- Forehead Glyph -->
  
        <!-- Sun Flame Mark -->
        <path d="M 250 142 Q 256 150 250 162 Q 244 150 250 142 Z" fill="#B9F6CA" stroke="#00C853" stroke-width="1.2" filter="url(#glow)"/>
        

  <!-- Sacred Relic -->
  
        <!-- Radiant Dragon Pearl Orb -->
        <circle cx="120" cy="330" r="24" fill="url(#orb-grad)" filter="url(#hyper-glow)"/>
        <circle cx="120" cy="330" r="10" fill="#FFFFFF"/>
        <path d="M 100 330 Q 120 300 140 330" stroke="#B9F6CA" stroke-width="2" fill="none" opacity="0.8"/>
        
</svg>