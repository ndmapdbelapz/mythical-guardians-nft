<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#4F370C"/>
      <stop offset="55%" stop-color="#2F2107"/>
      <stop offset="100%" stop-color="#150F03"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFE57F"/>
      <stop offset="85%" stop-color="#EA80FC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA80FC" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#80D8FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D0A1C" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA80FC"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#EA80FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#EA80FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#80D8FF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#EA80FC"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Zodiac Constellation Star Chart -->
        <circle cx="250" cy="210" r="130" stroke="#EA80FC" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>
        <g stroke="#FFE57F" stroke-width="1" opacity="0.75" fill="#FFE57F">
          <line x1="120" y1="120" x2="180" y2="90"/>
          <line x1="180" y1="90" x2="250" y2="110"/>
          <line x1="250" y1="110" x2="320" y2="80"/>
          <line x1="320" y1="80" x2="380" y2="130"/>
          <circle cx="120" cy="120" r="3.5"/>
          <circle cx="180" cy="90" r="4.5"/>
          <circle cx="250" cy="110" r="5.5"/>
          <circle cx="320" cy="80" r="4"/>
          <circle cx="380" cy="130" r="3.5"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  <g filter="url(#glow)"><line x1="425.0" y1="220.0" x2="460.0" y2="220.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="265.3" x2="435.5" y2="269.7" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="307.5" x2="431.9" y2="325.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="343.7" x2="385.8" y2="355.8" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="371.6" x2="355.0" y2="401.9" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="389.0" x2="299.7" y2="405.5" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="395.0" x2="250.0" y2="430.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="389.0" x2="200.3" y2="405.5" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="371.6" x2="145.0" y2="401.9" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="343.7" x2="114.2" y2="355.8" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="307.5" x2="68.1" y2="325.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="265.3" x2="64.5" y2="269.7" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="75.0" y1="220.0" x2="40.0" y2="220.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="174.7" x2="64.5" y2="170.3" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="132.5" x2="68.1" y2="115.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="96.3" x2="114.2" y2="84.2" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="68.4" x2="145.0" y2="38.1" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="51.0" x2="200.3" y2="34.5" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="45.0" x2="250.0" y2="10.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="51.0" x2="299.7" y2="34.5" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="68.4" x2="355.0" y2="38.1" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="96.3" x2="385.8" y2="84.2" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="132.5" x2="431.9" y2="115.0" stroke="#EA80FC" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="174.7" x2="435.5" y2="170.3" stroke="#EA80FC" stroke-width="2" opacity="0.75"/></g><circle cx="250" cy="220" r="170" stroke="#80D8FF" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#EA80FC" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#FFE57F" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#FFFFFF"/>
        <circle cx="430" cy="340" r="3.5" fill="#EA80FC"/>
        <circle cx="160" cy="70" r="2.5" fill="#80D8FF"/>
        <circle cx="340" cy="65" r="3" fill="#EA80FC"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#EA80FC" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFE57F" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#0D0A1C" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#2F2107" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#FFFFFF" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="tiger-body">
          <!-- Muscular Tiger Shoulders & Torso -->
          <path d="M 160 380 C 150 290 190 240 250 240 C 310 240 350 290 340 380 Z" fill="url(#body-grad)" stroke="#0D0A1C" stroke-width="2.5"/>
          <!-- Pointed Triangular Ears -->
          <polygon points="190,140 165,85 215,115" fill="url(#body-grad)" stroke="#0D0A1C" stroke-width="2"/>
          <polygon points="185,130 172,95 205,115" fill="#FFFFFF"/>
          <polygon points="310,140 335,85 285,115" fill="url(#body-grad)" stroke="#0D0A1C" stroke-width="2"/>
          <polygon points="315,130 328,95 295,115" fill="#FFFFFF"/>
          <!-- Tiger Head -->
          <ellipse cx="250" cy="180" rx="68" ry="58" fill="url(#body-grad)" stroke="#0D0A1C" stroke-width="2"/>
          <!-- Muzzle & Snout -->
          <ellipse cx="250" cy="205" rx="30" ry="20" fill="#0D0A1C" stroke="#FFFFFF" stroke-width="2"/>
          <polygon points="243,195 257,195 250,205" fill="#EA80FC"/>
          <!-- Fierce Curved Fangs -->
          <polygon points="228,215 238,215 233,238" fill="#FFFFFF" stroke="#0D0A1C" stroke-width="1"/>
          <polygon points="272,215 262,215 267,238" fill="#FFFFFF" stroke="#0D0A1C" stroke-width="1"/>
          <!-- Celestial War Stripes -->
          <path d="M 185 160 Q 210 165 220 175 M 315 160 Q 290 165 280 175" stroke="#0D0A1C" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 180 195 Q 210 200 225 205 M 320 195 Q 290 200 275 205" stroke="#0D0A1C" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 195 225 Q 215 228 228 230 M 305 225 Q 285 228 272 230" stroke="#0D0A1C" stroke-width="4" stroke-linecap="round"/>
          <!-- Iron Gorget Collar at Chest -->
          <path d="M 195 270 Q 250 295 305 270 L 290 310 Q 250 335 210 310 Z" fill="#0D0A1C" stroke="#EA80FC" stroke-width="2.5"/>
          <circle cx="250" cy="295" r="7" fill="#EA80FC" filter="url(#glow)"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#0D0A1C" stroke="#EA80FC" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#FFEB3B" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#0D0A1C" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#0D0A1C" stroke="#EA80FC" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#FFEB3B" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#0D0A1C" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <g transform="translate(250, 136)">
          <path d="M -30 0 Q 0 -12 30 0 L 25 8 Q 0 -4 -25 8 Z" fill="#EA80FC" stroke="#0D0A1C" stroke-width="1.5"/>
          <circle cx="0" cy="-3" r="5" fill="#FFFFFF"/>
        </g>
        

  <!-- Forehead Glyph -->
  
        <!-- Taiji Yin-Yang Mark -->
        <g transform="translate(250, 155)">
          <circle cx="0" cy="0" r="9" fill="#EA80FC" stroke="#0D0A1C" stroke-width="1" filter="url(#glow)"/>
          <path d="M 0 -9 A 4.5 4.5 0 0 1 0 0 A 4.5 4.5 0 0 0 0 9 A 9 9 0 0 1 0 -9" fill="#0D0A1C"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Celestial Vajra / Sword Relic -->
        <g transform="translate(110, 320)">
          <line x1="0" y1="35" x2="28" y2="0" stroke="#EA80FC" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
          <circle cx="14" cy="18" r="6" fill="#FFFFFF" stroke="#FFE57F" stroke-width="1.5"/>
        </g>
        
</svg>