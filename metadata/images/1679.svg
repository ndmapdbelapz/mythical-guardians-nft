<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#340863"/>
      <stop offset="55%" stop-color="#18042F"/>
      <stop offset="100%" stop-color="#090114"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2F1"/>
      <stop offset="85%" stop-color="#A7FFEB"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7FFEB" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#64FFDA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#012B24" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7FFEB"/>
      <stop offset="35%" stop-color="#00BFA5"/>
      <stop offset="75%" stop-color="#64FFDA"/>
      <stop offset="100%" stop-color="#012B24"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#A7FFEB"/>
      <stop offset="50%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#012B24"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A7FFEB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#A7FFEB"/>
      <stop offset="70%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#012B24"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Celestial Disk & Astral Starfield -->
        <circle cx="250" cy="210" r="135" fill="url(#celestial-disk)"/>
        <g fill="#E0F2F1" opacity="0.8">
          <circle cx="90" cy="80" r="2.5"/><circle cx="410" cy="95" r="3"/>
          <circle cx="140" cy="50" r="2"/><circle cx="360" cy="60" r="2.5"/>
          <circle cx="70" cy="170" r="1.5"/><circle cx="430" cy="190" r="2"/>
        </g>
        

  <!-- Sacred Halo Geometry -->
  <circle cx="250" cy="220" r="190" stroke="#64FFDA" stroke-width="1.5" fill="none" opacity="0.5"/><circle cx="440.0" cy="220.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="414.5" cy="315.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="345.0" cy="384.5" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="250.0" cy="410.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="155.0" cy="384.5" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="85.5" cy="315.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="60.0" cy="220.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="85.5" cy="125.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="155.0" cy="55.5" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="250.0" cy="30.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="345.0" cy="55.5" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="414.5" cy="125.0" r="7" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Weather & Particle Atmosphere -->
  
        <ellipse cx="95" cy="140" rx="14" ry="20" fill="#64FFDA" opacity="0.7" transform="rotate(25 95 140)"/>
        <ellipse cx="405" cy="150" rx="14" ry="20" fill="#64FFDA" opacity="0.7" transform="rotate(-25 405 150)"/>
        <ellipse cx="250" cy="75" rx="16" ry="22" fill="#A7FFEB" opacity="0.85"/>
        <ellipse cx="140" cy="360" rx="12" ry="18" fill="#64FFDA" opacity="0.6" transform="rotate(-15 140 360)"/>
        <ellipse cx="360" cy="370" rx="12" ry="18" fill="#64FFDA" opacity="0.6" transform="rotate(15 360 370)"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#A7FFEB" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#E0F2F1" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#012B24" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#18042F" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#00BFA5" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="garuda-body">
          <!-- Solar Eagle Grand Wings -->
          <path d="M 250 260 Q 150 140 60 160 Q 120 250 180 320 Z" fill="url(#wing-grad)" stroke="#A7FFEB" stroke-width="2"/>
          <path d="M 250 260 Q 350 140 440 160 Q 380 250 320 320 Z" fill="url(#wing-grad)" stroke="#A7FFEB" stroke-width="2"/>
          <!-- Torso & Golden Armor Gorget -->
          <path d="M 205 380 Q 215 240 250 230 Q 285 240 295 380 Z" fill="url(#body-grad)" stroke="#012B24" stroke-width="2"/>
          <!-- Armored Chest Breastplate -->
          <polygon points="250,250 280,270 270,310 250,325 230,310 220,270" fill="#012B24" stroke="#A7FFEB" stroke-width="2.5"/>
          <circle cx="250" cy="285" r="8" fill="#A7FFEB" filter="url(#glow)"/>
          <!-- Garuda Raptor Head -->
          <circle cx="250" cy="165" r="32" fill="url(#body-grad)" stroke="#012B24" stroke-width="2"/>
          <!-- Hooked Sun-Eagle Beak -->
          <path d="M 240 170 Q 250 170 255 180 Q 252 205 245 210 Q 242 195 240 180 Z" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5"/>
          <!-- Solar Sun Wheel Crown Spikes -->
          <path d="M 225 140 L 210 95 M 240 135 L 235 85 M 255 135 L 260 85 M 270 140 L 285 95" stroke="#A7FFEB" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#E0F2F1"/>
        <circle cx="268" cy="170" r="7" fill="#00E676" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#E0F2F1"/>
        

  <!-- Headwear / Horns / Masks -->
  

  <!-- Forehead Glyph -->
  
        <!-- Imperial King Glyph '王' -->
        <g transform="translate(239, 148)" stroke="#A7FFEB" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
          <line x1="0" y1="0" x2="22" y2="0"/>
          <line x1="3" y1="8" x2="19" y2="8"/>
          <line x1="0" y1="16" x2="22" y2="16"/>
          <line x1="11" y1="0" x2="11" y2="16"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Laozi Thunder Gourd -->
        <g transform="translate(370, 320)">
          <ellipse cx="14" cy="14" rx="10" ry="9" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5"/>
          <ellipse cx="14" cy="28" rx="15" ry="14" fill="#A7FFEB" stroke="#012B24" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#00BFA5" stroke-width="2.5"/>
        </g>
        
</svg>