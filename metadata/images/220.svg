<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0E381C"/>
      <stop offset="55%" stop-color="#072010"/>
      <stop offset="100%" stop-color="#030E07"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B388FF"/>
      <stop offset="85%" stop-color="#03DAC6"/>
      <stop offset="100%" stop-color="#6200EA"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#03DAC6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3700B3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09001A" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="35%" stop-color="#6200EA"/>
      <stop offset="75%" stop-color="#3700B3"/>
      <stop offset="100%" stop-color="#09001A"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#03DAC6"/>
      <stop offset="50%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#09001A"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#03DAC6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3700B3" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#03DAC6"/>
      <stop offset="70%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#09001A"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Solar Eclipse Coronal Flare -->
        <circle cx="250" cy="205" r="145" fill="#03DAC6" opacity="0.3" filter="url(#bright-glow)"/>
        <circle cx="250" cy="205" r="115" stroke="#03DAC6" stroke-width="12" fill="none" opacity="0.8" stroke-dasharray="14 8"/>
        <circle cx="250" cy="205" r="110" fill="#09001A"/>
        <polygon points="250,75 256,105 250,98 244,105" fill="#03DAC6" filter="url(#glow)"/>
        <polygon points="380,205 350,211 357,205 350,199" fill="#03DAC6" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  
        <circle cx="250" cy="220" r="195" stroke="#03DAC6" stroke-width="3" fill="none" opacity="0.65"/>
        <path d="M 80 200 Q 140 160 200 210 Q 250 170 300 210 Q 360 160 420 200" stroke="#3700B3" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
        <circle cx="250" cy="220" r="178" stroke="#6200EA" stroke-width="1.5" fill="none" stroke-dasharray="12 6" opacity="0.6"/>
        

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="75" cy="110" r="3.5" fill="#03DAC6" filter="url(#glow)"/>
        <circle cx="425" cy="130" r="4" fill="#B388FF" filter="url(#glow)"/>
        <circle cx="70" cy="350" r="3" fill="#6200EA"/>
        <circle cx="430" cy="340" r="3.5" fill="#03DAC6"/>
        <circle cx="160" cy="70" r="2.5" fill="#3700B3"/>
        <circle cx="340" cy="65" r="3" fill="#03DAC6"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#03DAC6" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#B388FF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#09001A" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#072010" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#6200EA" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="phoenix-body">
          <!-- Grand Multi-Tiered Arched Wings -->
          <path d="M 250 250 Q 170 120 70 130 Q 110 210 160 270 Z" fill="url(#wing-grad)" stroke="#03DAC6" stroke-width="2.5"/>
          <path d="M 250 250 Q 330 120 430 130 Q 390 210 340 270 Z" fill="url(#wing-grad)" stroke="#03DAC6" stroke-width="2.5"/>
          <!-- Feather Primary Blades -->
          <path d="M 70 130 Q 40 165 65 210 M 95 155 Q 70 195 95 240 M 120 180 Q 95 225 125 270" stroke="#B388FF" stroke-width="3" fill="none"/>
          <path d="M 430 130 Q 460 165 435 210 M 405 155 Q 430 195 405 240 M 380 180 Q 405 225 375 270" stroke="#B388FF" stroke-width="3" fill="none"/>
          <!-- Phoenix Torso & Golden Breast -->
          <path d="M 220 220 Q 250 180 280 220 Q 285 290 250 335 Q 215 290 220 220 Z" fill="url(#body-grad)" stroke="#09001A" stroke-width="2"/>
          <ellipse cx="250" cy="265" rx="22" ry="38" fill="url(#belly-grad)" opacity="0.9"/>
          <!-- Graceful Neck & Head -->
          <path d="M 240 210 Q 242 165 250 150 Q 258 165 260 210 Z" fill="url(#body-grad)"/>
          <circle cx="250" cy="145" r="18" fill="url(#body-grad)" stroke="#03DAC6" stroke-width="1.5"/>
          <!-- Golden Raptor Beak -->
          <polygon points="250,148 266,152 250,158" fill="#03DAC6" stroke="#09001A" stroke-width="1"/>
          <!-- Triple Coronal Crown Feathers -->
          <path d="M 245 130 Q 225 80 205 90 M 250 128 Q 250 70 250 75 M 255 130 Q 275 80 295 90" stroke="#03DAC6" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
          <!-- Flowing Cascading Tail Plumes -->
          <path d="M 240 330 Q 200 400 170 470 M 250 335 Q 250 410 250 480 M 260 330 Q 300 400 330 470" stroke="#03DAC6" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Starburst / Spiral Divine Eyes -->
        <circle cx="232" cy="170" r="7" fill="#E040FB" filter="url(#bright-glow)"/>
        <polygon points="232,164 234,170 240,170 235,173 237,178 232,174 227,178 229,173 224,170 230,170" fill="#B388FF"/>
        <circle cx="268" cy="170" r="7" fill="#E040FB" filter="url(#bright-glow)"/>
        <polygon points="268,164 270,170 276,170 271,173 273,178 268,174 263,178 265,173 260,170 266,170" fill="#B388FF"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <g transform="translate(250, 136)">
          <path d="M -30 0 Q 0 -12 30 0 L 25 8 Q 0 -4 -25 8 Z" fill="#03DAC6" stroke="#09001A" stroke-width="1.5"/>
          <circle cx="0" cy="-3" r="5" fill="#6200EA"/>
        </g>
        

  <!-- Forehead Glyph -->
  
        <!-- Imperial King Glyph '王' -->
        <g transform="translate(239, 148)" stroke="#03DAC6" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
          <line x1="0" y1="0" x2="22" y2="0"/>
          <line x1="3" y1="8" x2="19" y2="8"/>
          <line x1="0" y1="16" x2="22" y2="16"/>
          <line x1="11" y1="0" x2="11" y2="16"/>
        </g>
        

  <!-- Sacred Relic -->
  
        <!-- Bronze Scrying Mirror -->
        <circle cx="380" cy="330" r="20" fill="#09001A" stroke="#03DAC6" stroke-width="3" filter="url(#glow)"/>
        <circle cx="380" cy="330" r="14" fill="#03DAC6" opacity="0.4"/>
        <circle cx="380" cy="330" r="6" fill="#B388FF"/>
        
</svg>