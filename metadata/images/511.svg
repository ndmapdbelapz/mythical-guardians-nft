<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realm Sky Gradient -->
    <radialGradient id="sky-bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#591F56"/>
      <stop offset="55%" stop-color="#2E153B"/>
      <stop offset="100%" stop-color="#120B1A"/>
    </radialGradient>

    <!-- Celestial Moon Disk Gradient -->
    <radialGradient id="moon-grad" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </radialGradient>

    <!-- Celestial Glow Disk -->
    <radialGradient id="celestial-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#90A4AE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ECEFF1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#172026" stop-opacity="0"/>
    </radialGradient>

    <!-- Body Shading Multi-Stop Gradient -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="35%" stop-color="#CFD8DC"/>
      <stop offset="75%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#172026"/>
    </linearGradient>

    <!-- Wing & Feather Gradient -->
    <linearGradient id="wing-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#172026"/>
    </linearGradient>

    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#90A4AE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ECEFF1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radiant Relic Orb Gradient -->
    <radialGradient id="orb-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#90A4AE"/>
      <stop offset="70%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#172026"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bright-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realm Sky Background -->
  <rect width="500" height="500" fill="url(#sky-bg)"/>

  <!-- Dynamic Celestial Feature -->
  
        <!-- Layered Mountain Peaks & Floating Isles -->
        <path d="M 0 320 Q 90 210 180 280 T 360 250 T 500 310 L 500 500 L 0 500 Z" fill="#172026" opacity="0.8"/>
        <path d="M 80 290 Q 180 180 280 270 T 460 240 L 500 300 L 500 500 L 0 500 Z" fill="#2E153B" opacity="0.5"/>
        <ellipse cx="120" cy="140" rx="45" ry="14" fill="#172026" opacity="0.85"/>
        <ellipse cx="380" cy="120" rx="55" ry="16" fill="#172026" opacity="0.85"/>
        <circle cx="250" cy="190" r="110" fill="#90A4AE" opacity="0.18" filter="url(#glow)"/>
        

  <!-- Sacred Halo Geometry -->
  <g filter="url(#glow)"><line x1="425.0" y1="220.0" x2="460.0" y2="220.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="265.3" x2="435.5" y2="269.7" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="307.5" x2="431.9" y2="325.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="343.7" x2="385.8" y2="355.8" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="371.6" x2="355.0" y2="401.9" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="389.0" x2="299.7" y2="405.5" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="395.0" x2="250.0" y2="430.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="389.0" x2="200.3" y2="405.5" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="371.6" x2="145.0" y2="401.9" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="343.7" x2="114.2" y2="355.8" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="307.5" x2="68.1" y2="325.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="265.3" x2="64.5" y2="269.7" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="75.0" y1="220.0" x2="40.0" y2="220.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="81.0" y1="174.7" x2="64.5" y2="170.3" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="98.4" y1="132.5" x2="68.1" y2="115.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="126.3" y1="96.3" x2="114.2" y2="84.2" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="162.5" y1="68.4" x2="145.0" y2="38.1" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="204.7" y1="51.0" x2="200.3" y2="34.5" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="250.0" y1="45.0" x2="250.0" y2="10.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="295.3" y1="51.0" x2="299.7" y2="34.5" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="337.5" y1="68.4" x2="355.0" y2="38.1" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="373.7" y1="96.3" x2="385.8" y2="84.2" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="401.6" y1="132.5" x2="431.9" y2="115.0" stroke="#90A4AE" stroke-width="2" opacity="0.75"/>
<line x1="419.0" y1="174.7" x2="435.5" y2="170.3" stroke="#90A4AE" stroke-width="2" opacity="0.75"/></g><circle cx="250" cy="220" r="170" stroke="#ECEFF1" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Weather & Particle Atmosphere -->
  
        <circle cx="80" cy="180" r="18" fill="#CFD8DC" opacity="0.8" filter="url(#glow)"/>
        <circle cx="80" cy="180" r="8" fill="#90A4AE"/>
        <circle cx="420" cy="170" r="20" fill="#CFD8DC" opacity="0.8" filter="url(#glow)"/>
        <circle cx="420" cy="170" r="9" fill="#90A4AE"/>
        <circle cx="250" cy="85" r="14" fill="#ECEFF1" opacity="0.85" filter="url(#glow)"/>
        <circle cx="250" cy="85" r="6" fill="#FFFFFF"/>
        

  <!-- Floating Divine Hagoromo Ribbons -->
  
    <!-- Flowing Divine Scarf (Hagoromo) -->
    <path d="M 70 380 C 110 260 140 180 200 160 C 240 145 260 145 300 160 C 360 180 390 260 430 380"
          stroke="#90A4AE" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 65 390 C 105 270 135 190 195 170 C 235 155 265 155 305 170 C 365 190 395 270 435 390"
          stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.85"/>
    

  <!-- Grounding Mist & Clouds -->
  
    <path d="M -30 450 Q 80 400 190 440 Q 300 390 410 430 Q 480 390 530 450 L 530 500 L -30 500 Z" fill="#172026" opacity="0.95"/>
    <path d="M 0 465 Q 120 420 240 460 Q 360 410 500 460 L 500 500 L 0 500 Z" fill="#2E153B" opacity="0.65"/>
    <path d="M 40 480 Q 150 450 260 480 Q 380 445 480 485 L 480 500 L 40 500 Z" fill="#CFD8DC" opacity="0.3" filter="url(#glow)"/>
    

  <!-- Beast Anatomy & Stance -->
  
        <g id="garuda-body">
          <!-- Solar Eagle Grand Wings -->
          <path d="M 250 260 Q 150 140 60 160 Q 120 250 180 320 Z" fill="url(#wing-grad)" stroke="#90A4AE" stroke-width="2"/>
          <path d="M 250 260 Q 350 140 440 160 Q 380 250 320 320 Z" fill="url(#wing-grad)" stroke="#90A4AE" stroke-width="2"/>
          <!-- Torso & Golden Armor Gorget -->
          <path d="M 205 380 Q 215 240 250 230 Q 285 240 295 380 Z" fill="url(#body-grad)" stroke="#172026" stroke-width="2"/>
          <!-- Armored Chest Breastplate -->
          <polygon points="250,250 280,270 270,310 250,325 230,310 220,270" fill="#172026" stroke="#90A4AE" stroke-width="2.5"/>
          <circle cx="250" cy="285" r="8" fill="#90A4AE" filter="url(#glow)"/>
          <!-- Garuda Raptor Head -->
          <circle cx="250" cy="165" r="32" fill="url(#body-grad)" stroke="#172026" stroke-width="2"/>
          <!-- Hooked Sun-Eagle Beak -->
          <path d="M 240 170 Q 250 170 255 180 Q 252 205 245 210 Q 242 195 240 180 Z" fill="#90A4AE" stroke="#172026" stroke-width="1.5"/>
          <!-- Solar Sun Wheel Crown Spikes -->
          <path d="M 225 140 L 210 95 M 240 135 L 235 85 M 255 135 L 260 85 M 270 140 L 285 95" stroke="#90A4AE" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        

  <!-- Eyes & Gaze -->
  
        <!-- Slit Dragon / Predator Eyes -->
        <ellipse cx="232" cy="170" rx="9" ry="6" fill="#172026" stroke="#90A4AE" stroke-width="1"/>
        <circle cx="232" cy="170" r="5" fill="#FFEB3B" filter="url(#bright-glow)"/>
        <line x1="232" y1="165" x2="232" y2="175" stroke="#172026" stroke-width="2"/>
        <ellipse cx="268" cy="170" rx="9" ry="6" fill="#172026" stroke="#90A4AE" stroke-width="1"/>
        <circle cx="268" cy="170" r="5" fill="#FFEB3B" filter="url(#bright-glow)"/>
        <line x1="268" y1="165" x2="268" y2="175" stroke="#172026" stroke-width="2"/>
        

  <!-- Headwear / Horns / Masks -->
  
        <!-- Tilted Porcelain Kitsune Spirit Mask -->
        <g transform="translate(265, 120) rotate(18)">
          <ellipse cx="0" cy="0" rx="22" ry="16" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
          <polygon points="-14,-14 -8,-24 0,-14" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
          <polygon points="14,-14 8,-24 0,-14" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
          <path d="M -8 -2 Q -4 4 0 -2 M 8 -2 Q 4 4 0 -2" stroke="#CFD8DC" stroke-width="2" fill="none"/>
          <circle cx="0" cy="6" r="2" fill="#172026"/>
        </g>
        

  <!-- Forehead Glyph -->
  

  <!-- Sacred Relic -->
  
        <!-- Radiant Dragon Pearl Orb -->
        <circle cx="120" cy="330" r="24" fill="url(#orb-grad)" filter="url(#hyper-glow)"/>
        <circle cx="120" cy="330" r="10" fill="#FFFFFF"/>
        <path d="M 100 330 Q 120 300 140 330" stroke="#90A4AE" stroke-width="2" fill="none" opacity="0.8"/>
        
</svg>